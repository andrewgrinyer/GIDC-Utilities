<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grinyer · Company Dashboard</title>

<!-- gidc-guard
     who: staff. Andrew, 20 October: the team may look at this. Setting a
     target and typing a number stay with administrators, which is decided
     twice over: the two buttons are not drawn for anybody else, and the
     database refuses the write whatever the page shows. Who counts as
     staff for reading is kpi_may_read() in kpi-staff-read-only.sql, not
     this line, so changing your mind is one word in one place there. -->
<script>window.GIDC_TOOL = {who: 'staff'};</script>
<script src="/gate.js"></script>
<script src="/guard.js"></script>

<style>
.viz-root{
  color-scheme: light;
  /* chrome is the brand, data is not. A red bar chart reads as an alarm,
     so the brand colour stays on the header and the buttons and the data
     gets one calm hue of its own. */
  --paper:#F4F3F1; --card:#FFFFFF; --ink:#17171A; --muted:#6E6E76;
  --rule:#E2E2E6; --rule-soft:#EFEFF2;
  --brand:#C80000; --brand-soft:#FCECEC; --brand-dark:#9E0000;

  --series-1:#2a78d6;          /* the bars: one series, one hue */
  --series-soft:#D7E6F8;       /* the same hue, recessive, for older periods */

  /* status, fixed, never themed. Always shipped with an arrow and words,
     never colour on its own: red against green is the one pair a colour
     blind reader cannot separate, and roughly one man in twelve is. */
  --good:#0ca30c; --good-soft:#E8F6E8;
  --bad:#d03b3b;  --bad-soft:#FBEAEA;
  --flat:#6E6E76; --flat-soft:#EFEFF2;
  --pad:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad) 70px}

/* ---- the header ---- */
.hero{background:var(--brand);color:#fff;margin:0 0 22px;
  background-image:linear-gradient(100deg,var(--brand-dark),var(--brand) 62%)}
.hero .in{max-width:1180px;margin:0 auto;padding:22px var(--pad) 24px;
  display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
/* sized by height, so the bar decides rather than the file */
.hero .logo{height:42px;width:auto;display:block;align-self:center;flex:0 0 auto}
@media (max-width:640px){ .hero .logo{height:30px} }
.hero h1{font-size:26px;margin:0;letter-spacing:-.015em;font-weight:700}
.hero .sub{opacity:.82;font-size:14px;margin:4px 0 0}
.hero .now{margin-left:auto;text-align:right}
.hero .now b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
.hero .now span{display:block;font-size:12.5px;opacity:.8;margin-top:2px}

/* ---- filters, one row above the charts ---- */
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.bar label{font-size:12px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
/* the four lengths of time, as one segmented control: they are four
   answers to one question, so they are drawn as one thing */
.modes{display:inline-flex;border:1px solid var(--rule);border-radius:9px;
  overflow:hidden;background:var(--card);margin-right:4px}
.mode{appearance:none;border:0;background:transparent;font:inherit;font-size:14px;
  color:var(--muted);padding:9px 14px;min-height:38px;cursor:pointer;
  border-right:1px solid var(--rule)}
.mode:last-child{border-right:0}
.mode:hover{background:var(--rule-soft);color:var(--ink)}
.mode.on{background:var(--brand);color:#fff;font-weight:600}
.mode:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
@media (max-width:560px){ .modes{width:100%} .mode{flex:1;padding:9px 6px} }

.bar select,.bar input{padding:8px 11px;border:1px solid var(--rule);border-radius:9px;
  font:inherit;font-size:14px;background:var(--card);color:var(--ink);min-height:38px}
.bar select:focus,.bar input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.bar .sp{flex:1}
button.act{border:1px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:9px;font:600 14px/1 inherit;padding:11px 15px;min-height:38px;cursor:pointer}
button.act.on{background:var(--brand);border-color:var(--brand);color:#fff}
button.go{border:0;border-radius:9px;background:var(--brand);color:#fff;
  font:600 14px/1 inherit;padding:11px 17px;min-height:40px;cursor:pointer}
button.go:disabled{opacity:.5;cursor:default}

/* ---- a section ---- */
.sect{background:var(--card);border:1px solid var(--rule);border-radius:13px;
  margin:0 0 16px;overflow:hidden}
.sect > h2{font-size:12.5px;margin:0;padding:13px 18px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);font-weight:700;
  border-bottom:1px solid var(--rule-soft);background:#FBFBFA}

/* ---- a metric row: name, graph, the two figures, the verdict ---- */
.row{display:grid;grid-template-columns:184px 1fr 100px 80px 80px 142px 158px;
  gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--rule-soft)}
.row:last-child{border-bottom:0}
.row .nm b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.row .nm span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
/* a feed that has stopped arriving. Red, because a blank cell on its own
   reads as a quiet day and this is not one. */
.row .nm span.stale{color:var(--bad);font-weight:600}
.heads{display:grid;grid-template-columns:184px 1fr 100px 80px 80px 142px 158px;gap:14px;
  padding:8px 18px 7px;border-bottom:1px solid var(--rule-soft);
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:700;background:#FDFDFC}
.heads .r{text-align:right}

/* ---- one metric, with its people, is one block ----
   Andrew, 16 October: the lines were in the wrong places. Every row had
   one under it, so a person was separated from the figure they are part
   of by the same rule that separated two different metrics, and nothing
   said where a block began. Now the only strong line on the page is
   between blocks, and inside a block nothing is ruled off except the
   total, which keeps a hairline above it the way a column of figures is
   added up. */
.grp{border-bottom:1px solid var(--rule)}
.grp:last-child{border-bottom:0}
.grp .row{border-bottom:0}

/* the name of the metric, at the top where it is read first */
.gh{display:flex;align-items:baseline;gap:10px;padding:14px 18px 2px;flex-wrap:wrap}
.gh b{font-size:14.5px;font-weight:700;line-height:1.3}
.gh span{font-size:11.5px;color:var(--muted)}

/* The people are part rows: stepped in, lighter, smaller figures, so
   they read as belonging to the total under them rather than as five
   metrics of their own. */
.row.part{padding-top:7px;padding-bottom:7px}
.row.part .nm{padding-left:14px;border-left:3px solid var(--rule)}
.row.part .nm b{font-weight:500;font-size:13.5px;color:var(--muted)}
.row.part .fig b{font-size:15px;font-weight:600;color:var(--ink)}
.row.part .chart,.row.part .chart svg{height:26px}
.row.whole{border-top:1px solid var(--rule-soft);padding-top:11px;margin-top:3px}
.row.whole .nm{padding-left:14px}
.row.whole .nm b{font-weight:700}

/* the figures. Tabular numerals so a column of them lines up. */
.fig{text-align:right;font-variant-numeric:tabular-nums}
.fig b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.fig span{display:block;font-size:11px;color:var(--muted);margin-top:1px}

/* the verdict. Arrow and words first, colour second. */
.verdict{display:flex;align-items:center;gap:7px;font-size:12.5px;
  padding:5px 9px;border-radius:8px;justify-content:flex-end;
  font-variant-numeric:tabular-nums}
.verdict .ar{font-size:13px;line-height:1}
.verdict.good{background:var(--good-soft);color:var(--good)}
.verdict.bad {background:var(--bad-soft); color:var(--bad)}
.verdict.flat{background:var(--flat-soft);color:var(--flat)}
.verdict.none{background:transparent;color:var(--muted);font-style:italic}

/* the chart */
.chart{position:relative;height:46px}
.chart svg{display:block;width:100%;height:46px;overflow:visible}
.chart .base{stroke:var(--rule);stroke-width:1}
.chart .tgt{stroke:var(--flat);stroke-width:1;stroke-dasharray:3 3;opacity:.55}
.bars rect{fill:var(--series-soft)}
.bars rect.last{fill:var(--series-1)}
.bars rect.hit{cursor:pointer}
/* a reading drawn as a trend. The line is the same hue as the bars so
   the two kinds read as one dashboard, and the newest point is the
   solid one for the same reason the newest bar is. */
.spark polyline{fill:none;stroke:var(--series-1);stroke-width:1.5;
                stroke-linejoin:round;stroke-linecap:round}
.spark circle.last{fill:var(--series-1)}
.spark circle.lone{fill:var(--series-soft)}
svg rect.hit{cursor:pointer}
.tip{position:absolute;z-index:40;background:var(--ink);color:#fff;font-size:12px;
  padding:6px 9px;border-radius:7px;white-space:nowrap;pointer-events:none;
  transform:translate(-50%,-100%);opacity:0;transition:opacity .09s}
.tip.on{opacity:1}
.tip i{font-style:normal;opacity:.75}

.msg{padding:12px 14px;border-radius:10px;font-size:14px;margin:0 0 16px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.good{background:var(--good-soft);color:var(--good)}
/* Andrew, 20 October: a plain statement rather than a fault. Somebody
   who may not read the dashboard has done nothing wrong, so this is
   quiet grey and not the red that means something broke. */
.msg.info{background:#F0F0F2;color:var(--muted)}
.empty{padding:30px 18px;text-align:center;color:var(--muted);font-size:14.5px}

/* ---- the two panels ---- */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:13px;
  padding:18px;margin:0 0 16px}
.panel h2{font-size:16px;margin:0 0 4px}
.panel p.lede{color:var(--muted);font-size:13.5px;margin:0 0 16px;max-width:66ch}
table.grid{width:100%;border-collapse:collapse;font-size:14px}
table.grid th{text-align:left;font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0 10px 7px 0}
table.grid th.r,table.grid td.r{text-align:right}
table.grid td{padding:6px 10px 6px 0;border-top:1px solid var(--rule-soft)}
table.grid input{width:112px;padding:8px 10px;border:1px solid var(--rule);
  border-radius:8px;font:inherit;font-size:14px;text-align:right;
  font-variant-numeric:tabular-nums;min-height:38px}
table.grid input:focus{outline:2px solid var(--brand);outline-offset:-1px}
table.grid .unit{color:var(--muted);font-size:12px}
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center}

.foot{color:var(--muted);font-size:12px;margin:18px 2px 0;line-height:1.6}
.gidc-build{position:fixed;right:10px;bottom:8px;z-index:60;font-size:11px;line-height:1;
  color:#8E8E99;opacity:.7;pointer-events:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.hide{display:none}

/* Narrower screens drop the full period verdict and keep the pace one,
   because mid period the pace is the one that tells you anything. */
@media (max-width:1180px){
  .row,.heads{grid-template-columns:184px 1fr 100px 80px 80px 158px}
  .row .verdict.full,.heads .vf{display:none}
}
@media (max-width:900px){
  .row,.heads{grid-template-columns:150px 1fr 88px 76px 76px}
  .row .verdict,.heads .v,.row .verdict.full,.heads .vf{display:none}
  .row.wide{grid-template-columns:150px 1fr 88px 76px 76px}
}
@media (max-width:620px){
  .row{grid-template-columns:1fr 1fr;gap:8px 12px}
  .heads{display:none}
  .row .chart{grid-column:1 / -1;order:3}
  .row .nm{grid-column:1 / -1}
  .row .verdict{grid-column:1 / -1;order:4;justify-content:flex-start}
  .row .verdict.full{display:none}
  .fig{text-align:left}
}
</style>
</head>

<script>
(function(){
'use strict';

var $ = function(id){ return document.getElementById(id); };
/* Andrew, 10:43: a capital on every word of a title. Only the first
   letter of a word is touched, so GIDC stays GIDC and a label with a
   capital already inside it keeps it. */
/* Where a number came from, in the words someone would use for it
   rather than the word the database stores. Anything not listed falls
   back to the stored word, so a source added later still reads as
   something rather than as nothing. */
function sourceWords(source){
  var said = {
    manual:   'typed in',
    access:   'from the office database',
    portal:   'from the dealer portal',
    computed: 'worked out',
    callrail: 'from CallRail',
    sheet:    'from the website form'
  };
  return said[source] || ('from ' + source);
}

function titleCase(s){
  return String(s == null ? '' : s).replace(/(^|[\s(\/])([a-z])/g,
    function(_, before, letter){ return before + letter.toUpperCase(); });
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
}

var SECTIONS = [
  ['lead',       'Leads'],
  ['sold',       'Sold'],
  ['wholesale',  'Wholesale'],
  ['production', 'Production'],
  ['install',    'Installation']
];

var ME = null;

/* Andrew, 20 October: the team may read this, administrators may change
   it. Everything that writes asks this first.

   It is deliberately a question about the role rather than a flag set
   once at startup, because ME arrives after the first paint and a flag
   read too early would say no to an administrator and then never be
   asked again. */
function mayEdit(){ return !!(ME && ME.role === 'admin'); }

var METRICS = [];     /* kpi_metrics */
var VALUES  = [];     /* kpi_values for the chosen grain */
var SPLITS  = [];     /* kpi_split: one row per person per bucket */

/* Andrew, 09:36: four buttons across the top for the length of time the
   headline figure covers. Last week and this week are the same length
   read one bucket apart, which is why a mode is not simply a grain.
     key, button, grain, what the figure column is called, how far back
     the chart looks by default */
var MODES = [
  ['year',     'Year',      'year',  'This year',  5],
  ['month',    'Month',     'month', 'This month', 12],
  ['lastweek', 'Last week', 'week',  'Last week',  12],
  ['thisweek', 'This week', 'week',  'This week',  12]
];
var mode  = 'month';  /* how the business already thinks, so the default */
function modeRow(){
  for(var i = 0; i < MODES.length; i++) if(MODES[i][0] === mode) return MODES[i];
  return MODES[1];
}
function grainOf(){ return modeRow()[2]; }

/* yesterday's figure sits beside the period one, so a quiet day shows up
   the morning after rather than at the end of the month */
var YESTERDAY = {};
var YDIM = {};        /* yesterday again, one entry per person per metric */
/* and today, which Andrew asked for on 19 October. Yesterday says
   whether the place ran; today says whether it is running. Read exactly
   the same way, one request for the company and one for the people. */
var TODAY = {};
var TDIM  = {};
/* the last day each metric holds a figure for, so a feed that has gone
   quiet is marked rather than leaving a blank cell that reads as a
   quiet day. Empty where kpi-feed-health.sql has not been run. */
var STALE = {};
/* How many days behind is worth saying. Two, because every feed writes
   at least daily and a weekend is not a gap: the sources write a nought
   for a quiet day rather than nothing at all. */
var STALE_AFTER = 2;
function staleNote(m){
  var h = STALE[m.key];
  if(!h || h.days_old === null || h.days_old === undefined) return '';
  var n = Number(h.days_old);
  /* a computed line has no feed of its own and follows the ones it is
     worked out from, so marking it would say the same thing twice */
  if(m.kind === 'ratio' || m.kind === 'sum') return '';
  if(!(n > STALE_AFTER)) return '';
  return 'nothing since ' + fmtDay(h.last_day) + ', ' + n + ' days ago';
}
function fmtDay(iso){
  if(!iso) return '';
  var p = String(iso).split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  var mon = ['Jan','Feb','Mar','Apr','May','Jun',
             'Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  var day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  return day + ' ' + d.getDate() + ' ' + mon;
}
function isoDay(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}
function todayISO(){ return isoDay(new Date()); }
function yesterdayISO(){
  var d = new Date();
  d.setDate(d.getDate() - 1);
  return isoDay(d);
}
var PERIODS = [];     /* period_start, name, weeks, newest first */
var span = 12;        /* how many periods of history to draw */
var at = null;        /* the bucket the figures are for, in the current view */
var MONTHS = [];      /* the GIDC periods, newest first, whatever the view */
var TARGETS = [];     /* what is stored against the period being edited */
var ALLT    = [];     /* every target row, for the rates, which read
                         their own rather than being handed one */
var tat = null;       /* the period targets are being set for */
var panel = null;     /* 'targets' | 'entry' | null */
var busy = false;

/* ---- numbers, written the way each one is read -------------------- */
function fmt(v, unit){
  /* Blank rather than a dash. The verdict column already says "no data"
     where there is none, and a dash in a figure reads as missing even
     when the figure does not apply at all, as a weekly rate does not on
     a single day. */
  if(v === null || v === undefined || v === '') return '';
  var n = Number(v);
  if(!isFinite(n)) return String(v);
  if(unit === 'money'){
    /* whole dollars on a dashboard. Cents are noise at this distance. */
    return '$' + Math.round(n).toLocaleString('en-US');
  }
  if(unit === 'percent') return (n * 100).toFixed(1) + '%';
  if(unit === 'days')    return n.toLocaleString('en-US', {maximumFractionDigits:1});
  return n.toLocaleString('en-US', {maximumFractionDigits: n % 1 ? 1 : 0});
}
/* Big money is shortened because nobody reads nine digits at a glance,
   but an average sale is a number people quote, so anything under a
   hundred thousand is written out in full. $7k would be hiding $7,093. */
function shortMoney(n){
  if(n >= 1000000) return '$' + (n / 1000000).toFixed(2).replace(/\.?0+$/, '') + 'm';
  if(n >= 100000)  return '$' + Math.round(n / 1000) + 'k';
  return '$' + Math.round(n).toLocaleString('en-US');
}

function message(kind, text){
  var m = $('msg');
  if(!kind){ m.className = 'hide'; m.textContent = ''; return; }
  m.className = 'msg ' + kind; m.textContent = text;
}

/* ---- reading ------------------------------------------------------- */
function load(){
  return Promise.all([
    GIDCAuth.api('/rest/v1/kpi_metrics?select=*&active=eq.true&order=section,sort',
        {headers: GIDCAuth.headers()})
      .then(function(r){ if(!r.ok) throw new Error('Could not read the metrics (' + r.status + ')');
                         return r.json(); }),
    GIDCAuth.api('/rest/v1/kpi_values?select=*&grain=eq.' + grainOf() +
                 '&order=bucket_start.desc',
        {headers: GIDCAuth.headers()})
      .then(function(r){ if(!r.ok) throw new Error('Could not read the numbers (' + r.status + ')');
                         return r.json(); }),
    /* The numbers that are broken down by salesperson. A database that
       has not had the latest file run against it has no such view, so a
       failure here leaves the dashboard whole and simply unsplit rather
       than refusing to draw. */
    GIDCAuth.api('/rest/v1/kpi_split?select=*&grain=eq.' + grainOf() +
                 '&order=bucket_start.desc',
        {headers: GIDCAuth.headers()})
      .then(function(r){ return r.ok ? r.json() : []; })
      .catch(function(){ return []; }),
    /* yesterday on its own, whatever length the rest is being read over */
    GIDCAuth.api('/rest/v1/kpi_values?select=metric,total&grain=eq.day' +
                 '&bucket_start=eq.' + yesterdayISO(),
        {headers: GIDCAuth.headers()})
      .then(function(r){ return r.ok ? r.json() : []; })
      .catch(function(){ return []; }),
    /* every target, for the rates. The table is one row per metric per
       time somebody changed it, so it is small, and a rate has to find
       its own: the rollup the rest of the page reads leaves ratios out
       by design. A database without the targets table still draws. */
    GIDCAuth.api('/rest/v1/kpi_targets?select=metric,period_start,weekly,monthly' +
                 '&order=period_start.desc',
        {headers: GIDCAuth.headers()})
      .then(function(r){ return r.ok ? r.json() : []; })
      .catch(function(){ return []; }),
    /* YESTERDAY, PER PERSON
       Andrew, 13:08: four orders sold yesterday showed in the total and
       against nobody's name. The column was left empty for the people
       on purpose and the reasoning was wrong: I said it would cost a
       round trip per salesperson, and it is one request for every
       person and every metric at once, the same shape as the company
       figure beside it. */
    GIDCAuth.api('/rest/v1/kpi_split?select=metric,dim,total&grain=eq.day' +
                 '&bucket_start=eq.' + yesterdayISO(),
        {headers: GIDCAuth.headers()})
      .then(function(r){ return r.ok ? r.json() : []; })
      .catch(function(){ return []; }),
    /* TODAY, THE SAME TWO REQUESTS AGAIN
       Andrew, 19 October. Today is the one that moves while you are
       looking at it, so it sits next to the period total and yesterday
       sits beyond it, newest first across the page. A day with nothing
       in it yet is blank rather than nought: at nine in the morning a
       nought reads as a bad day rather than as an early one. */
    GIDCAuth.api('/rest/v1/kpi_values?select=metric,total&grain=eq.day' +
                 '&bucket_start=eq.' + todayISO(),
        {headers: GIDCAuth.headers()})
      .then(function(r){ return r.ok ? r.json() : []; })
      .catch(function(){ return []; }),
    GIDCAuth.api('/rest/v1/kpi_split?select=metric,dim,total&grain=eq.day' +
                 '&bucket_start=eq.' + todayISO(),
        {headers: GIDCAuth.headers()})
      .then(function(r){ return r.ok ? r.json() : []; })
      .catch(function(){ return []; }),
    /* WHICH FIGURES HAVE STOPPED ARRIVING
       Andrew, 19 October: the web submissions stopped on the fifteenth
       and the cell simply went blank, which looks exactly like a quiet
       day. One small request, one row per metric, and a line that has
       stopped coming says so under its name. A database without the
       view still draws: it simply marks nothing. */
    GIDCAuth.api('/rest/v1/kpi_feed_health?select=metric,last_day,days_old',
        {headers: GIDCAuth.headers()})
      .then(function(r){ return r.ok ? r.json() : []; })
      .catch(function(){ return []; })
  ]).then(function(got){
    METRICS = got[0] || [];
    /* Andrew, 20 October: who may read this is one list, and it lives in
       the database as kpi_may_read(). The page does not keep a second
       copy of it, because two lists drift apart and the day they do,
       somebody is let through a door that then shows them nothing.

       So the page asks instead of guessing. A reader who is not on the
       list gets a clean empty answer here rather than an error, which
       would otherwise draw as a dashboard where every figure is blank
       and read as a company that has stopped trading. */
    if(!METRICS.length){
      message('info', 'This dashboard is not one of yours. If it should be, ' +
                      'ask Andrew to add you.');
      $('board').innerHTML = '';
      $('filters').innerHTML = '';
      return;
    }
    VALUES  = got[1] || [];
    SPLITS  = got[2] || [];
    ALLT    = got[4] || [];
    YESTERDAY = {};
    (got[3] || []).forEach(function(r){ YESTERDAY[r.metric] = Number(r.total); });
    YDIM = {};
    (got[5] || []).forEach(function(r){ YDIM[r.metric + '|' + r.dim] = Number(r.total); });
    TODAY = {};
    (got[6] || []).forEach(function(r){ TODAY[r.metric] = Number(r.total); });
    TDIM = {};
    (got[7] || []).forEach(function(r){ TDIM[r.metric + '|' + r.dim] = Number(r.total); });
    STALE = {};
    (got[8] || []).forEach(function(r){ STALE[r.metric] = r; });
    /* the buckets that actually have something in them, newest first */
    var seen = {};
    PERIODS = [];
    VALUES.forEach(function(v){
      if(seen[v.bucket_start]) return;
      seen[v.bucket_start] = true;
      PERIODS.push({start: v.bucket_start, end: v.bucket_end, name: v.name, weeks: v.weeks});
    });
    PERIODS.sort(function(a, b){ return a.start < b.start ? 1 : -1; });
    /* Last week is the one before the newest. Every other mode opens on
       the newest, and the dropdown can still step back from there. */
    if(!at || !seen[at]){
      var want = mode === 'lastweek' ? 1 : 0;
      at = PERIODS.length ? (PERIODS[Math.min(want, PERIODS.length - 1)].start) : null;
    }
    draw();
  }).catch(function(err){
    $('board').innerHTML = '<div class="sect"><div class="empty">' + esc(err.message) + '</div></div>';
  });
}

/* every stored value for one metric, oldest first, over the drawn span */
function seriesFor(key){
  var window_ = PERIODS.slice(0, span).map(function(p){ return p.start; }).reverse();
  var by = {};
  VALUES.forEach(function(v){ if(v.metric === key) by[v.bucket_start] = v; });
  return window_.map(function(s){
    var p = PERIODS.find(function(x){ return x.start === s; });
    return {start: s, name: p ? p.name : s, row: by[s] || null};
  });
}

/* ---- broken down by salesperson ------------------------------------
   Andrew, 14 October: the sales figures per person with the total under
   them. The people are listed biggest first, and the total is the one
   the target is judged against, because a target is set for the company
   and not for each person. */
function peopleIn(key, periodStart){
  return SPLITS.filter(function(r){
      return r.metric === key && r.bucket_start === periodStart && r.dim; })
    .sort(function(a, b){ return Number(b.total) - Number(a.total); });
}
/* one person's own history, over the same window as everything else */
function splitSeriesFor(key, dim){
  var by = {};
  SPLITS.forEach(function(r){
    if(r.metric === key && r.dim === dim) by[r.bucket_start] = r; });
  return PERIODS.slice(0, span).map(function(p){ return p.start; }).reverse()
    .map(function(s){
      var p = PERIODS.find(function(x){ return x.start === s; });
      return {start: s, name: p ? p.name : s, row: by[s] || null};
    });
}

/* A ratio or a sum is worked out here and never stored, so it cannot
   drift from the numbers printed beside it. A ratio divides its two
   parts; a sum adds them, which is what the two backlogs taken together
   is. Either way the parts come from the same rows the page is already
   showing.

   `from` is a map of metric to number when the figure is wanted for a
   single day, as the yesterday column wants it, and null when it should
   be read out of the period rows. */
function computedAt(m, periodStart, from){
  if(!m.formula) return null;
  var op = m.formula.indexOf('+') !== -1 ? '+' : '/';
  var parts = m.formula.split(op).map(function(s){ return s.trim(); });
  if(parts.length !== 2) return null;
  var get = function(key){
    if(from) return from[key] === undefined ? null : Number(from[key]);
    var r = VALUES.find(function(v){ return v.metric === key && v.bucket_start === periodStart; });
    return r ? Number(r.total) : null;
  };
  var a = get(parts[0]), b = get(parts[1]);
  if(a === null || b === null) return null;
  if(op === '+') return a + b;
  if(!b) return null;              /* a rate over nothing is not zero */
  return a / b;
}
/* ---- a rate can have a target now ----------------------------------
   Andrew, 16 October: close rate, sold over initial measurements, with
   a 55% target. Nothing on this page had ever given a rate a target:
   kpi_period_values leaves ratios out, because a rate is worked out
   when shown rather than stored, so a rate's row carried no target and
   the verdict column read "worked out" whatever was set.

   The target is read straight off kpi_targets here instead, by the same
   rule the database uses: the latest one set on or before the period
   being looked at, so changing it never regrades a month that has
   already been judged. */
/* ---- a rate worked out for one person ------------------------------
   Andrew, 11:43: the close rate per salesperson, in the cell where the
   share of the total used to sit.

   Nothing new is stored for this. Sold orders and initial measurements
   are both broken down by the same person for the same period, so one
   person's rate is one divided by the other, which is the same sum the
   company rate does with the totals.

   Found rather than written in: a rate belongs to the metric it divides
   BY, so Initial measurements shows the close rate because close rate
   is sold over measurements. If a second rate is ever added over a
   split metric, its people get the same treatment without a line of
   code here changing. */
function rateOn(m){
  if(!m.split_by) return null;
  for(var i = 0; i < METRICS.length; i++){
    var r = METRICS[i];
    /* A percentage only. Average sale is also a ratio over a split
       metric, total sales over sold orders, and without this test the
       Sold orders block printed every salesperson's average sale as a
       close rate: "742105.3% closed". It is a real figure wanting a
       dollar sign, not a rate, and this cell is for rates. */
    if(r.kind !== 'ratio' || r.unit !== 'percent') continue;
    if(!r.formula || r.formula.indexOf('/') === -1) continue;
    var parts = r.formula.split('/');
    if(parts.length !== 2) continue;
    var num = parts[0].trim();
    if(parts[1].trim() !== m.key) continue;
    var top = METRICS.find(function(x){ return x.key === num; });
    if(top && top.split_by === m.split_by) return {metric: r, num: num};
  }
  return null;
}
/* that person's number for another metric, same period */
function splitValue(key, dim, periodStart){
  var hit = SPLITS.find(function(s){
    return s.metric === key && s.dim === dim && s.bucket_start === periodStart; });
  return hit ? Number(hit.total) : null;
}
function targetRowFor(key, periodStart){
  var best = null;
  ALLT.forEach(function(t){
    if(t.metric !== key) return;
    if(periodStart && t.period_start > periodStart) return;
    if(!best || t.period_start > best.period_start) best = t;
  });
  return best;
}
function ratioAt(m, periodStart){
  var v = computedAt(m, periodStart, null);
  if(v === null) return null;
  var t = targetRowFor(m.key, periodStart);
  return {total: v, weekly: null, grain: grainOf(),
          target_monthly: t ? t.monthly : null, target_weekly: null};
}

/* ---- the verdict against target ------------------------------------
   The arrow and the words carry the meaning. The colour agrees with
   them, it does not do the work: red against green is precisely the
   pair a colour blind reader cannot separate. */
/* The target for the stretch on screen.
   Andrew, 16:38: targets were saving and then doing nothing, because
   this only ever read the period figure. A week was being judged
   against a whole period's target, so everything looked miles under; a
   year against the same figure, so everything looked miles over; and a
   metric given only a weekly target had no period figure at all and
   read as having no target set.

   A rate is scaled by the weeks in the bucket. A level is a reading
   rather than something that piles up, so its target is the same number
   whatever stretch is being looked at. */
function targetFor(m, row){
  if(!row) return null;
  var wk = row.target_weekly  == null ? null : Number(row.target_weekly);
  var mo = row.target_monthly == null ? null : Number(row.target_monthly);
  if(wk == null && mo == null) return null;
  /* A rate is the same number whatever stretch is on screen, the same
     as a reading is: 55% of measurements closing is 55% over a week and
     over a year. Scaling it by the weeks in the bucket, which is what a
     flow needs, would ask for 220% in a four week month. */
  if(m.kind === 'level' || m.kind === 'ratio') return mo != null ? mo : wk;

  var weeks = Number(row.weeks) || 1;
  var grain = row.grain || grainOf();
  /* A period target is what it says on a period, no arithmetic needed. */
  if(grain === 'month' && mo != null) return mo;
  /* Otherwise work in weeks. A period with no weekly figure is turned
     into one at the average period length, which is 52 weeks over 12
     periods rather than four, because four of ours are five weeks. */
  var rate = wk != null ? wk : mo / (52 / 12);
  return rate * weeks;
}

/* How much of the stretch on screen has gone.
   Andrew, 16:56: being ninety per cent short of a period's target on
   the third day of it is not news, it is arithmetic. This weighs the
   target by the part of the period that has actually happened, so the
   figure answers whether we are on pace rather than whether the period
   is finished.

   Counted in whole days, including today, because a day in progress is
   a day the work is being done in. A period that has ended gives one, a
   period that has not started gives nothing. */
function elapsed(row){
  if(!row || !row.bucket_start || !row.bucket_end) return null;
  var start = new Date(row.bucket_start + 'T00:00:00');
  var end   = new Date(row.bucket_end   + 'T00:00:00');
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var all = Math.round((end - start) / 86400000) + 1;
  if(!(all > 0)) return null;
  if(today < start) return 0;
  var gone = Math.round((today - start) / 86400000) + 1;
  if(gone >= all) return 1;
  return gone / all;
}

/* The pace verdict, or nothing where pro-rating would be nonsense. A
   backlog is a reading rather than a pile that grows through the
   period, and a rate is already a rate. */
function pace(m, row){
  if(m.kind === 'level' || m.kind === 'ratio' || m.kind === 'sum')
    return {cls:'none', ar:'', text:''};
  if(!row) return {cls:'none', ar:'', text:''};
  var full = targetFor(m, row);
  if(full == null) return {cls:'none', ar:'', text:''};
  var part = elapsed(row);
  if(part === null) return {cls:'none', ar:'', text:''};
  if(part === 0)    return {cls:'none', ar:'', text:'not started'};
  if(part === 1)    return {cls:'none', ar:'', text:'period over'};

  var want = full * part;
  var diff = Number(row.total) - want;
  var pct  = want ? Math.abs(diff / want) : 0;
  var up   = diff > 0;
  /* The column header already says what this is, so the cell carries
     the gap and how far through we are and nothing else. Said twice it
     wrapped onto a second line and read worse for it. */
  var soFar = ' (' + Math.round(part * 100) + '% in)';
  if(pct < 0.02) return {cls:'flat', ar:'●', text:'on pace' + soFar};
  var wanted = m.better === 'low' ? !up : up;
  return {cls: wanted ? 'good' : 'bad',
          ar: up ? '▲' : '▼',
          text: (up ? '+' : '−') + fmt(Math.abs(diff), m.unit) + soFar};
}

function verdict(m, row){
  if(!row) return {cls:'none', ar:'', text:'no data'};
  var target = targetFor(m, row);
  if(m.better === 'band' && (row.floor_value != null || row.ceiling_value != null)){
    var v = Number(row.total);
    if(row.ceiling_value != null && v > Number(row.ceiling_value))
      return {cls:'bad', ar:'▲', text:'over by ' + fmt(v - row.ceiling_value, m.unit)};
    if(row.floor_value != null && v < Number(row.floor_value))
      return {cls:'bad', ar:'▼', text:'under by ' + fmt(row.floor_value - v, m.unit)};
    return {cls:'good', ar:'●', text:'in range'};
  }
  if(target == null) return {cls:'none', ar:'', text:'no target set'};
  var diff = Number(row.total) - Number(target);
  var pct  = Number(target) ? Math.abs(diff / Number(target)) : 0;
  var up   = diff > 0;
  /* within two per cent of the target is neither good news nor bad */
  if(pct < 0.02) return {cls:'flat', ar:'●', text:'on target'};
  var wanted = m.better === 'low' ? !up : up;
  /* A rate against a rate is two percentages in one cell meaning
     different things: 43% against a 55% target read "−12.0% (22%)",
     where the first is a gap in points and the second is how far short
     that is. The gap is said in points so the two cannot be confused. */
  var gap = m.unit === 'percent'
          ? (Math.abs(diff) * 100).toFixed(1) + ' points'
          : fmt(Math.abs(diff), m.unit);
  return {cls: wanted ? 'good' : 'bad',
          ar: up ? '▲' : '▼',
          text: (up ? '+' : '−') + gap + ' (' + (pct * 100).toFixed(0) + '%)'};
}

/* ---- a reading drawn as a trend -------------------------------------
   Andrew, 20 October: the two booked figures should show a line, to see
   the trend.

   Two things make this different from the bars below it, and both are
   deliberate.

   It does not start at nought. A bar says how much, so its length has to
   be measured from nothing or it lies. A line says which way, and
   measuring that from nought throws away the whole of the answer: a
   fortnight between 39 and 43 drawn from nought is a flat line across
   the top nine tenths of an empty box. So the line uses the range the
   figures actually moved through, with a tenth of that range of air
   above and below, and the exact numbers are a hover away.

   For the same reason it has no rule along the bottom. The bars have
   one, and there it means nought. A rule under a line that does not
   start at nought would say nought and be wrong, so there is nothing
   there to misread.

   A gap stays a gap. A period with no reading breaks the line rather
   than being drawn straight through, because a straight line across a
   month nobody counted is an invention. */
function trendLine(m, series, vals, tgts, W, H, n){
  var seen = vals.filter(function(v){ return v != null; });
  if(!seen.length) return '';

  var t = tgts[n - 1];
  var lo = Math.min.apply(null, seen), hi = Math.max.apply(null, seen);
  /* the target belongs inside the picture, or a figure under it looks
     like it cleared one that is simply off the top of the box */
  if(t != null){ lo = Math.min(lo, t); hi = Math.max(hi, t); }
  var pad = (hi - lo) * 0.1;
  /* a figure that never moved still needs a band to sit in, and half a
     unit each way puts it down the middle rather than on the floor */
  if(!(pad > 0)) pad = Math.max(Math.abs(hi) * 0.05, 0.5);
  lo -= pad; hi += pad;

  var top = 3, bot = H - 3;                      /* room for the last dot */
  var y = function(v){ return bot - ((v - lo) / (hi - lo)) * (bot - top); };
  /* a single reading has nowhere to run, so it sits in the middle */
  var x = function(i){ return n === 1 ? W / 2 : (i * (W - 2) / (n - 1)) + 1; };

  var h = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" ' +
          'role="img" aria-label="' + esc(m.label) + ', how it has moved">';

  if(t != null){
    var ty = y(t);
    h += '<line class="tgt" x1="0" y1="' + ty.toFixed(2) + '" x2="' + W +
         '" y2="' + ty.toFixed(2) + '" vector-effect="non-scaling-stroke"></line>';
  }

  /* one run of points per unbroken stretch */
  h += '<g class="spark">';
  var run = [];
  var flush = function(){
    if(run.length > 1)
      h += '<polyline points="' + run.join(' ') + '" vector-effect="non-scaling-stroke"></polyline>';
    else if(run.length === 1)
      h += '<circle class="lone" cx="' + run[0].split(',')[0] + '" cy="' +
           run[0].split(',')[1] + '" r="1.4"></circle>';
    run = [];
  };
  vals.forEach(function(v, i){
    if(v == null){ flush(); return; }
    run.push(x(i).toFixed(2) + ',' + y(v).toFixed(2));
  });
  flush();

  /* the newest reading, which is the one the eye should land on */
  var lastAt = -1;
  for(var k = n - 1; k >= 0; k--) if(vals[k] != null){ lastAt = k; break; }
  if(lastAt >= 0)
    h += '<circle class="last" cx="' + x(lastAt).toFixed(2) + '" cy="' +
         y(vals[lastAt]).toFixed(2) + '" r="2"></circle>';
  h += '</g>';

  /* the hover targets: full height, so there is no hunting for a one
     pixel line, and invisible, so they change nothing about the picture */
  series.forEach(function(s, i){
    if(vals[i] == null) return;
    var w = n === 1 ? W : W / n;
    h += '<rect class="hit" x="' + (n === 1 ? 0 : Math.max(0, x(i) - w / 2)).toFixed(2) +
         '" y="0" width="' + w.toFixed(2) + '" height="' + H + '" fill="transparent" ' +
         'data-tip="' + esc(s.name + ': ' + fmt(vals[i], m.unit)) + '"></rect>';
  });

  h += '</svg>';
  return h;
}

/* ---- the chart -----------------------------------------------------
   One bar per period, newest on the right and in full colour so the eye
   lands on it. Thin marks, rounded tops, a two pixel gap of surface
   between neighbours, and the target as a dashed rule so you can see
   which periods cleared it without reading a single number. */
function chart(m, series){
  var W = 100, H = 46, n = series.length;
  if(!n) return '';
  var vals = series.map(function(s){ return s.row ? Number(s.row.total) : null; });
  /* The dashed rule has to be the target for the same stretch each bar
     covers, or it sits at a quarter height across a week view and makes
     every bar look like a triumph. */
  var tgts = series.map(function(s){ return s.row ? targetFor(m, s.row) : null; });

  /* Andrew, 20 October: a reading wants a line, not bars.
     A level is what was on the books at the moment somebody looked. It
     is not accumulated over the bucket the way sold orders are, so a bar
     rising from nought misstates it twice: it claims a quantity that was
     built up, and on a scale from nought it flattens the only thing
     worth seeing. Initial measurements at 39, 43, 39 is a real swing and
     drawn from nought it is three bars of the same height. */
  if(m.kind === 'level') return trendLine(m, series, vals, tgts, W, H, n);

  var top = Math.max.apply(null, vals.concat(tgts).filter(function(v){ return v != null; }).concat([0]));
  if(!(top > 0)) top = 1;

  var gap = 2, bw = Math.max(2, (W / n) - gap);
  var h = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" ' +
          'role="img" aria-label="' + esc(m.label) + ' by period">';
  /* the target line first, so the bars sit over it */
  var t = tgts[n - 1];
  if(t != null){
    var ty = H - (t / top) * (H - 4);
    h += '<line class="tgt" x1="0" y1="' + ty.toFixed(2) + '" x2="' + W +
         '" y2="' + ty.toFixed(2) + '" vector-effect="non-scaling-stroke"></line>';
  }
  h += '<g class="bars">';
  series.forEach(function(s, i) {
    var v = vals[i];
    if(v == null) return;
    var bh = Math.max(1.5, (v / top) * (H - 4));
    var x  = i * (W / n);
    h += '<rect class="hit' + (i === n - 1 ? ' last' : '') + '" x="' + x.toFixed(2) +
         '" y="' + (H - bh).toFixed(2) + '" width="' + bw.toFixed(2) +
         '" height="' + bh.toFixed(2) + '" rx="1.4" ' +
         'data-tip="' + esc(s.name + ': ' + fmt(v, m.unit)) + '"></rect>';
  });
  h += '</g>';
  h += '<line class="base" x1="0" y1="' + H + '" x2="' + W + '" y2="' + H +
       '" vector-effect="non-scaling-stroke"></line>';
  h += '</svg>';
  return h;
}

/* ---- drawing it all ------------------------------------------------ */
function drawFilters(){
  /* Four buttons rather than a dropdown, because this is the control
     that gets used every time the page is opened and a dropdown hides
     three of its four answers. */
  var h = '<div class="modes" role="group" aria-label="Length of time">';
  MODES.forEach(function(g){
    h += '<button class="mode' + (mode === g[0] ? ' on' : '') +
         '" data-mode="' + g[0] + '"' + (mode === g[0] ? ' aria-current="true"' : '') +
         '>' + esc(g[1]) + '</button>';
  });
  h += '</div>';

  /* "periods" was fine when a period was the only length there was. It
     says weeks, months or years now, in the person's own words. */
  var word = grainOf() === 'year' ? 'years' : grainOf() === 'week' ? 'weeks' : 'months';
  h += '<label>History</label><select data-span="1">';
  (grainOf() === 'year' ? [3, 5, 10, 20] : [6, 12, 24, 36]).forEach(function(n){
    h += '<option value="' + n + '"' + (span === n ? ' selected' : '') + '>' +
         n + ' ' + esc(word) + '</option>';
  });
  h += '</select>';
  h += '<label>Figures for</label><select data-at="1">';
  PERIODS.slice(0, 60).forEach(function(p){
    h += '<option value="' + esc(p.start) + '"' + (at === p.start ? ' selected' : '') + '>' +
         esc(p.name) + '</option>';
  });
  h += '</select><span class="sp"></span>';
  /* A target is set for a GIDC month and judged against that month. On a
     week there is nothing to set it against, and writing one keyed on a
     Monday would quietly corrupt the targets table, so the button is
     only there on months. */
  /* Andrew, 20 October: not drawn at all for somebody who may only look.
     Greying them out would be worse: a button that is visible and dead
     reads as something broken, and leaves a person wondering what they
     are missing. The filters above this line are untouched, so reading
     the dashboard is the same job for everybody. */
  if(mayEdit()){
    if(grainOf() === 'month')
      h += '<button class="act' + (panel === 'targets' ? ' on' : '') +
           '" data-panel="targets">Targets</button>';
    h += '<button class="act' + (panel === 'entry'   ? ' on' : '') + '" data-panel="entry">Enter numbers</button>';
  }
  $('filters').innerHTML = h;
}

/* What the figure column is called. The mode's words while you are
   looking at the current one, and the bucket's own name once you step
   back through the dropdown, because "This month" over September would
   be a lie. */
function periodLabel(){
  if(PERIODS.length && at === PERIODS[mode === 'lastweek' ? 1 : 0].start)
    return modeRow()[3];
  var p = PERIODS.find(function(x){ return x.start === at; });
  return p ? p.name : modeRow()[3];
}

/* The target column says which target it means.
   Andrew, 17:40: asked for "against monthly target", and he is right
   that "against target" does not say enough. It only says monthly in
   the month view though: the same column holds a week against a week's
   target and a year against a year's, so naming it monthly everywhere
   would be wrong in three views out of four. */
function targetHeader(){
  var g = grainOf();
  return g === 'week'  ? 'Against weekly target'
       : g === 'year'  ? 'Against yearly target'
       : g === 'day'   ? 'Against daily target'
       :                 'Against monthly target';
}

function drawNow(){
  /* the subtitle follows the grain, so the page never says month while
     showing weeks */
  var sub = $('sub');
  if(sub) sub.textContent = 'Leads, sales, production and installation, by ' +
    (grainOf() === 'year' ? 'year' : grainOf() === 'week' ? 'week' : 'GIDC month');

  var p = PERIODS.find(function(x){ return x.start === at; });
  if(!p){ $('now').innerHTML = ''; return; }
  var d = function(s){
    var b = String(s).split('-');
    return new Date(+b[0], +b[1] - 1, +b[2])
      .toLocaleDateString('en-CA', {month:'short', day:'numeric'});
  };
  /* A single day has no range and no week count. One week is a week,
     not "1 weeks". */
  var sub = p.start === p.end
          ? esc(d(p.start))
          : esc(d(p.start)) + ' to ' + esc(d(p.end)) +
            (p.weeks ? ' · ' + p.weeks + (Number(p.weeks) === 1 ? ' week' : ' weeks') : '');
  $('now').innerHTML = '<b>' + esc(p.name) + '</b><span>' + sub + '</span>';
}

function draw(){
  drawFilters();
  drawNow();

  if(!PERIODS.length){
    $('board').innerHTML = '<div class="sect"><div class="empty">' +
      'No numbers yet. Use Enter numbers to put the first ones in, or wait for ' +
      'tonight’s import.</div></div>';
    drawPanels();
    return;
  }

  var h = '';
  SECTIONS.forEach(function(sec){
    var mine = METRICS.filter(function(m){ return m.section === sec[0]; });
    if(!mine.length) return;
    h += '<div class="sect"><h2>' + esc(titleCase(sec[1])) + '</h2>' +
      '<div class="heads"><div>Metric</div><div>Last ' + span + ' ' +
        esc(grainOf() === 'year' ? 'years' : grainOf() === 'week' ? 'weeks' : 'months') +
        '</div>' +
      '<div class="r">' + esc(periodLabel()) + '</div>' +
      '<div class="r">Today</div><div class="r">Yesterday</div>' +
      '<div class="r v vf">' + esc(targetHeader()) + '</div>' +
      '<div class="r v">Current pace</div></div>';

    mine.forEach(function(m){
      var row, series;
      if(m.kind === 'ratio' || m.kind === 'sum'){
        row = ratioAt(m, at);
        /* a ratio is drawn from its own history, worked out period by period */
        series = PERIODS.slice(0, span).map(function(p){ return p.start; }).reverse()
          .map(function(s){
            var p = PERIODS.find(function(x){ return x.start === s; });
            var r = ratioAt(m, s);
            /* the whole row, so the dashed target rule is drawn across
               the rate's own history the way it is for everything else */
            return {start:s, name: p ? p.name : s, row: r};
          });
      } else {
        row = VALUES.find(function(v){ return v.metric === m.key && v.bucket_start === at; }) || null;
        series = seriesFor(m.key);
      }

      /* A worked out figure with a target against it is judged like any
         other. Without one it says so rather than reading "no target
         set", because for most of these there is nothing to set. */
      var vd = ((m.kind === 'ratio' || m.kind === 'sum') && targetFor(m, row) == null)
             ? {cls:'none', ar:'', text:'worked out'} : verdict(m, row);
      var pc = pace(m, row);
      var total  = row ? fmt(row.total, m.unit) : '';
      /* On a single day a weekly rate is not a smaller number, it is not
         a number at all: a day divided by a week is arithmetic nobody
         asked for. The column is left empty and unlabelled. */
      /* Andrew, 09:36: the second column is yesterday now, not a weekly
         rate. A weekly average told you the shape of a period; yesterday
         tells you whether the place ran. */
      var yday = YESTERDAY[m.key];
      if(m.kind === 'ratio' || m.kind === 'sum') yday = computedAt(m, null, YESTERDAY);
      var weekly = (yday === null || yday === undefined) ? '' : fmt(yday, m.unit);
      /* AND TODAY, BESIDE IT. Andrew, 19 October. */
      var tdy = TODAY[m.key];
      if(m.kind === 'ratio' || m.kind === 'sum') tdy = computedAt(m, null, TODAY);
      var todayFig = (tdy === null || tdy === undefined) ? '' : fmt(tdy, m.unit);
      if(m.unit === 'money' && row && row.total != null) total = shortMoney(Number(row.total));
      /* THE MONEY LINES WERE SHOWING A WEEKLY AVERAGE UNDER "YESTERDAY"
         Left over from when that column was a weekly rate: for a money
         metric the figure was thrown away and replaced by row.weekly,
         which is the period total divided by its weeks. So sold dollars
         and average sale read as a weekly average in a column headed
         yesterday. They read yesterday now, the same as every other
         line, and only the formatting differs. */
      if(m.unit === 'money'){
        if(yday !== null && yday !== undefined) weekly   = shortMoney(Number(yday));
        if(tdy  !== null && tdy  !== undefined) todayFig = shortMoney(Number(tdy));
      }

      /* the people first, the total under them, because that is the way
         Andrew reads it: who did what, then what it came to */
      var people = m.split_by ? peopleIn(m.key, at) : [];
      var whole  = row && Number(row.total) ? Number(row.total) : 0;

      /* Andrew, 16 October: the name at the top as well, not only in the
         summary underneath. Four names arriving before you are told what
         they are a count of is backwards, and with the rules sitting
         between rows rather than between metrics there was nothing to
         say where one figure ended and the next began.

         So a metric and its people are one block now, the block carries
         the name at the top, and the only strong line on the page is
         the one between blocks. */
      /* the rate this metric is the bottom half of, if there is one */
      var rate = people.length ? rateOn(m) : null;
      var rateTarget = rate ? targetFor(rate.metric, ratioAt(rate.metric, at)) : null;

      h += '<div class="grp">';
      if(people.length){
        h += '<div class="gh"><b>' + esc(titleCase(m.label)) + '</b><span>' +
          esc(sourceWords(m.source) + ' · by ' +
              (m.split_by === 'sales_rep' ? 'salesperson' : m.split_by) +
              /* the target is named here rather than in every row. With
                 none set the rates are still shown, uncoloured, and the
                 heading says nothing rather than "against ". */
              (rate ? ' · ' + rate.metric.label.toLowerCase() +
                      (rateTarget == null ? ''
                        : ' against ' + fmt(rateTarget, 'percent'))
                    : '')) +
          '</span></div>';
      }
      people.forEach(function(r){
        var pt = m.unit === 'money' ? shortMoney(Number(r.total)) : fmt(r.total, m.unit);
        /* their own yesterday, read in one request with everybody
           else's. A blank here was reading as nothing sold rather than
           as nothing fetched, which is how four orders could sit in the
           total with no name against them. */
        var py = YDIM[m.key + '|' + r.dim];
        var pw = (py === undefined) ? ''
               : (m.unit === 'money' ? shortMoney(py) : fmt(py, m.unit));
        /* and their own today, read the same way */
        var ptdv = TDIM[m.key + '|' + r.dim];
        var ptd = (ptdv === undefined) ? ''
                : (m.unit === 'money' ? shortMoney(ptdv) : fmt(ptdv, m.unit));
        var share = whole ? Math.round((Number(r.total) / whole) * 100) : null;

        /* THE CELL ON THE RIGHT: A RATE WHERE THERE IS ONE, THE SHARE
           WHERE THERE IS NOT

           Andrew, 11:43: in the measurements block that cell should be
           the person's own close rate rather than their share of the
           total. Their sold orders over their measurements, judged
           against the same target the company rate is judged against,
           so a row reading 61% beside a row reading 38% says which of
           the two is converting rather than which is busier.

           A person with measurements and nothing sold reads 0%, which
           is a fact. A person with no measurements at all is left blank
           rather than shown as a rate over nothing. */
        var cell;
        if(rate){
          var top = splitValue(rate.num, r.dim, at);
          var bot = Number(r.total);
          if(top === null || !bot){
            cell = '<div class="verdict full none"></div>';
          } else {
            var pr = {total: top / bot, grain: grainOf(), target_weekly: null,
                      target_monthly: (targetRowFor(rate.metric.key, at) || {}).monthly};
            var pj = targetFor(rate.metric, pr) == null
                   ? {cls:'none', ar:''} : verdict(rate.metric, pr);
            cell = '<div class="verdict full ' + pj.cls + '" data-tip="' +
              esc(rate.metric.label + ': ' + fmt(top / bot, 'percent') + ' of ' +
                  fmt(bot, m.unit) + ' ' + m.label.toLowerCase() + ' sold') + '">' +
              (pj.ar ? '<span class="ar" aria-hidden="true">' + pj.ar + '</span>' : '') +
              '<span>' + esc(fmt(top / bot, 'percent')) + ' closed</span></div>';
          }
        } else {
          cell = '<div class="verdict full none">' + (share == null ? '' :
            '<span>' + share + '% of the total</span>') + '</div>';
        }

        /* the word salesperson used to sit under every name. The block
           heading says it once, so five of them is five fewer things to
           read past. */
        h += '<div class="row part">' +
          '<div class="nm"><b>' + esc(r.dim) + '</b></div>' +
          '<div class="chart">' + chart(m, splitSeriesFor(m.key, r.dim)) + '</div>' +
          '<div class="fig"><b>' + esc(pt) + '</b><span>total</span></div>' +
          '<div class="fig"><b>' + esc(ptd) + '</b><span>' +
            esc(ptd === '' ? '' : 'today') + '</span></div>' +
          '<div class="fig"><b>' + esc(pw) + '</b><span>' +
            esc(pw === '' ? '' : 'yesterday') + '</span></div>' +
          cell +
          '<div class="verdict none"></div>' +
        '</div>';
      });

      h += '<div class="row' + (people.length ? ' whole' : '') + '">' +
        '<div class="nm"><b>' + esc(people.length ? 'All ' + people.length
                                                  : titleCase(m.label)) +
          '</b><span>' +
          esc(people.length ? 'added up'
            : m.kind === 'level' ? 'latest reading'
            : (m.kind === 'ratio' || m.kind === 'sum') ? 'worked out'
            : sourceWords(m.source)) +
          (m.unit === 'days' ? ' · days' : '') + '</span>' +
          /* and the warning, under the source it should be coming from */
          (staleNote(m) ? '<span class="stale">' + esc(staleNote(m)) + '</span>' : '') +
          '</div>' +
        '<div class="chart">' + chart(m, series) + '</div>' +
        '<div class="fig"><b>' + esc(total) + '</b><span>' +
          esc(m.kind === 'level' ? 'now'
            : m.kind === 'sum'   ? 'now'
            : m.kind === 'ratio' ? 'rate' : 'total') +
          '</span></div>' +
        /* a rate has no weekly figure: it is already a rate, and dividing
           it by the weeks would be meaningless arithmetic */
        '<div class="fig"><b>' + esc(todayFig) + '</b><span>' +
          esc(todayFig === '' ? '' : 'today') + '</span></div>' +
        '<div class="fig"><b>' + esc(weekly) + '</b><span>' +
          esc(weekly === '' ? '' : 'yesterday') + '</span></div>' +
        '<div class="verdict full ' + vd.cls + '">' +
          (vd.ar ? '<span class="ar" aria-hidden="true">' + vd.ar + '</span>' : '') +
          '<span>' + esc(vd.text) + '</span></div>' +
        '<div class="verdict ' + pc.cls + '">' +
          (pc.ar ? '<span class="ar" aria-hidden="true">' + pc.ar + '</span>' : '') +
          '<span>' + esc(pc.text) + '</span></div>' +
      '</div></div>';
    });
    h += '</div>';
  });
  $('board').innerHTML = h;

  var manual = METRICS.filter(function(m){ return m.source === 'manual'; })
    .map(function(m){ return m.label; });
  $('foot').innerHTML = 'A GIDC month runs from the first Monday of the month to the ' +
    'day before the next one starts, so it is four or five whole weeks and every day ' +
    'belongs to one. Flows are added up; a level shows its latest reading, because ' +
    'adding four weeks of backlog readings together would mean nothing. Ratios are ' +
    'worked out here and never stored.' +
    (manual.length ? '<br>Still typed in by hand: ' + esc(manual.join(', ')) + '.' : '');

  drawPanels();
}

/* ---- targets ------------------------------------------------------- */
function drawPanels(){
  /* A panel can only be open because a button opened it, and those
     buttons are not drawn for a reader. This is here for the case the
     buttons cannot cover: a role that changes under a page already open,
     which is what happens when somebody signs out and somebody else
     signs in on the same screen. */
  if(!mayEdit()) panel = null;
  var tp = $('targets'), ep = $('entry');
  tp.classList.toggle('hide', panel !== 'targets');
  ep.classList.toggle('hide', panel !== 'entry');
  if(panel === 'targets') drawTargets();
  if(panel === 'entry')   drawEntry();
}

/* The periods targets can be set against, read from the table rather
   than from whatever the current view happens to be bucketed by.
   Andrew, 16:07: targets set in the week or year view were being
   written against a Monday or a January, and a Monday is not a GIDC
   period, so the database refused the lot and fifteen minutes of typing
   went with it. Targets are a monthly thing and now say so, whatever is
   on screen behind them. */
function loadMonths(){
  if(MONTHS.length) return Promise.resolve(MONTHS);
  /* Andrew, 16:49: this asked for the newest 48 periods. The table runs
     to 2032, so the newest 48 were 2029 to 2032, this month was not in
     the list at all, and the panel opened on December 2032. A set of
     targets went in dated six years out.

     It now asks for the periods up to a year ahead and takes the
     newest from there, so the list is the last two years and the next
     one, with this month in the middle of it. */
  var ahead = new Date();
  ahead.setFullYear(ahead.getFullYear() + 1);
  return GIDCAuth.api('/rest/v1/kpi_periods?select=period_start,period_end,name,weeks' +
      '&period_start=lte.' + isoDay(ahead) +
      '&order=period_start.desc&limit=36', {headers: GIDCAuth.headers()})
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows){
      MONTHS = (rows || []).map(function(p){
        return {start: p.period_start, end: p.period_end, name: p.name, weeks: p.weeks};
      });
      return MONTHS;
    })
    .catch(function(){ return []; });
}

/* What is already set for the period being edited. Read straight from
   the targets table, because the figures view buckets by the current
   grain and in a week view it has nothing to say about a month. */
/* What is in force for the period being edited, which is not the same
   as what was typed against it.
   Andrew, 17:07: a target applies from its period onwards, so one set
   in January is in force in October without there being an October row.
   Asking only for rows dated exactly at the chosen period showed blank
   boxes for targets that very much existed, and saving one figure then
   wrote a fresh row with nothing in the others, which supersedes the
   January one and quietly unsets everything it did not carry. Not
   zeros, which would at least be visible: nulls, which read as "no
   target set".

   So this asks for everything up to and including the chosen period and
   keeps the newest for each metric, which is the same rule the
   dashboard itself uses. The boxes then open on what is actually in
   force, and saving writes the whole picture forward rather than a
   fragment of it. */
function loadTargetsFor(start){
  if(!start) { TARGETS = []; return Promise.resolve([]); }
  return GIDCAuth.api('/rest/v1/kpi_targets?select=metric,period_start,weekly,' +
      'monthly,floor_value,ceiling_value&period_start=lte.' +
      encodeURIComponent(start) + '&order=period_start.desc',
      {headers: GIDCAuth.headers()})
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows){
      var best = {};
      (rows || []).forEach(function(t){
        /* newest first, so the first one seen for a metric wins */
        if(!best[t.metric]) best[t.metric] = t;
      });
      TARGETS = Object.keys(best).map(function(k){ return best[k]; });
      return TARGETS;
    })
    .catch(function(){ TARGETS = []; return []; });
}

function drawTargets(){
  if(!MONTHS.length){
    $('targets').innerHTML = '<h2>Targets</h2><p class="lede">Reading the periods…</p>';
    loadMonths().then(function(){
      if(!tat && MONTHS.length){
        /* The period we are in. Failing that the newest one that has
           actually started, which is a sane place to be even if the
           periods table ever has a gap in it. Never simply the first
           row of the list, which is how targets ended up in 2032. */
        var today = isoDay(new Date());
        var now = MONTHS.find(function(m){ return m.start <= today && today <= m.end; });
        if(!now) now = MONTHS.find(function(m){ return m.start <= today; });
        tat = (now || MONTHS[0]).start;
      }
      return loadTargetsFor(tat);
    }).then(function(){ if(panel === 'targets') drawTargets(); });
    return;
  }
  var p = MONTHS.find(function(x){ return x.start === tat; });
  var h = '<h2>Targets</h2><p class="lede">What good looks like, from ' +
    esc(p ? p.name : 'this period') + ' onwards. Earlier periods keep being judged ' +
    'against whatever was set at the time, so nothing is quietly regraded. For a ' +
    'backlog, set a floor and a ceiling instead: too low is its own kind of problem.</p>';
  h += '<div class="bar"><label>Targets for</label><select data-tat="1">';
  MONTHS.forEach(function(m){
    h += '<option value="' + esc(m.start) + '"' + (tat === m.start ? ' selected' : '') +
         '>' + esc(m.name) + '</option>';
  });
  var today = isoDay(new Date());
  var ahead = p && p.start > today;
  h += '</select><span class="unit">' +
       (ahead ? '<b style="color:#B00">This period has not started yet. ' +
                'Anything set here will not show on the dashboard until it does.</b>'
              : 'Targets are set a period at a time, whichever view is on behind this. ' +
                'They apply from the chosen period onwards. Boxes already filled in ' +
                'are what is in force now, carried forward from when it was set, and ' +
                'saving keeps them.') +
       '</span></div>';
  h += '<table class="grid"><thead><tr><th>Metric</th><th class="r">A week</th>' +
       '<th class="r">A period</th><th class="r">Floor</th><th class="r">Ceiling</th>' +
       '<th>Good when</th></tr></thead><tbody>';
  /* Rates are in this list now. They were left out because none of them
     could carry a target; close rate can, so leaving them out would
     mean a target nobody can see or change without opening the
     database. A sum has nothing of its own to aim at: it is two other
     figures added up and each has its own target. */
  METRICS.filter(function(m){ return m.kind !== 'sum'; }).forEach(function(m){
    var row = TARGETS.find(function(t){ return t.metric === m.key; });
    var band = m.better === 'band';
    /* A percentage is held as a fraction everywhere else on the page,
       because that is what dividing one number by another gives. The
       box shows 55 and stores 0.55, so nobody has to know that. */
    var pc = m.unit === 'percent';
    /* A figure carried forward from an earlier period is marked, so it
       is clear the box is showing something real rather than something
       typed here. */
    var from = row && row.period_start && row.period_start !== tat
             ? (MONTHS.find(function(x){ return x.start === row.period_start; }) || {}).name
             : null;
    var box = function(field, val, on){
      if(!on) return '<span class="unit">not set</span>';
      var shown = val == null ? '' : (pc ? Math.round(Number(val) * 1000) / 10 : val);
      return '<input type="number" step="any" data-t="' + esc(m.key) + '" ' +
             'data-f="' + field + '"' + (pc ? ' data-pc="1"' : '') +
             ' value="' + esc(shown) + '">';
    };
    /* a rate is one number, not a weekly and a period one */
    var wkBox = m.kind === 'ratio' ? '<span class="unit">same every week</span>'
                                   : box('weekly', row && row.weekly, !band);
    h += '<tr><td><b>' + esc(m.label) + '</b> <span class="unit">' +
         esc(m.unit === 'money' ? '$' : m.unit === 'days' ? 'days'
             : m.unit === 'percent' ? '%' : '') +
         (from ? ' · set ' + esc(from) : '') + '</span></td>' +
      '<td class="r">' + wkBox + '</td>' +
      '<td class="r">' + box('monthly', row && row.monthly, !band) + '</td>' +
      '<td class="r">' + box('floor_value',   row && row.floor_value,   band) + '</td>' +
      '<td class="r">' + box('ceiling_value', row && row.ceiling_value, band) + '</td>' +
      '<td><span class="unit">' +
        esc(band ? 'inside the band' : m.better === 'low' ? 'lower' : 'higher') +
      '</span></td></tr>';
  });
  h += '</tbody></table><div class="acts">' +
       '<button class="go" data-savetargets="1">Save targets</button>' +
       '<span class="unit" id="tmsg"></span></div>';
  $('targets').innerHTML = h;
}

/* ---- the three that are still typed in ----------------------------- */
function drawEntry(){
  var manual = METRICS.filter(function(m){ return m.source === 'manual'; });
  var today = new Date();
  var iso = today.getFullYear() + '-' +
            String(today.getMonth() + 1).padStart(2, '0') + '-' +
            String(today.getDate()).padStart(2, '0');
  var h = '<h2>Enter numbers</h2><p class="lede">For one day at a time. These are ' +
    'the ones nothing feeds yet. Doors cut and doors painted stop being manual the ' +
    'moment door production status is added to the Access change history.</p>';
  h += '<div class="bar"><label>Day</label>' +
       '<input type="date" id="eday" value="' + iso + '" max="' + iso + '"></div>';
  h += '<table class="grid"><thead><tr><th>Metric</th><th class="r">That day</th>' +
       '<th>Which way is good</th></tr></thead><tbody>';
  manual.forEach(function(m){
    h += '<tr><td><b>' + esc(m.label) + '</b></td>' +
      '<td class="r"><input type="number" step="any" min="0" data-e="' + esc(m.key) + '"></td>' +
      '<td><span class="unit">' + esc(m.better === 'low' ? 'lower' : 'higher') +
      '</span></td></tr>';
  });
  h += '</tbody></table><div class="acts">' +
       '<button class="go" data-saveentry="1">Save the day</button>' +
       '<span class="unit" id="emsg"></span></div>';
  $('entry').innerHTML = h;
  loadDay(iso);
}

/* Show what is already stored for that day, so typing over it is a
   deliberate correction rather than an accident. */
function loadDay(day){
  var keys = METRICS.filter(function(m){ return m.source === 'manual'; })
    .map(function(m){ return m.key; });
  if(!keys.length) return;
  GIDCAuth.api('/rest/v1/kpi_daily?select=metric,value&on_date=eq.' +
      encodeURIComponent(day) + '&metric=in.(' + keys.join(',') + ')',
      {headers: GIDCAuth.headers()})
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows){
      keys.forEach(function(k){
        var box = document.querySelector('[data-e="' + k + '"]');
        if(!box) return;
        var hit = (rows || []).find(function(x){ return x.metric === k; });
        box.value = hit && hit.value != null ? hit.value : '';
      });
    })
    .catch(function(){ });
}

/* ---- writing -------------------------------------------------------- */
function saveTargets(btn){
  if(busy) return;
  if(!mayEdit()){ $('tmsg').textContent = 'Targets are set by an administrator.'; return; }
  /* Every row carries all four fields, even the two that do not apply.
     A backlog has a floor and a ceiling and no weekly target; everything
     else has the weekly and the period and no band. Sent as they come,
     that is a batch of objects with different keys, and PostgREST
     refuses the whole batch with "All object keys must match" rather
     than taking the rows it understands.

     Andrew, 16:07: this is why fifteen minutes of targets went in and
     came back as only the sales ones. The first save, before he reached
     a backlog, had matching keys and went through. Every save after it
     had a band target in it and was refused outright. Filling all four
     in, null where they do not apply, makes every row the same shape. */
  var rows = {};
  var BLANK = {weekly:null, monthly:null, floor_value:null, ceiling_value:null};
  document.querySelectorAll('[data-t]').forEach(function(box){
    var k = box.dataset.t;
    if(!rows[k]){
      rows[k] = {metric:k, period_start:tat, set_by:(ME && ME.name) || null};
      Object.keys(BLANK).forEach(function(f){ rows[k][f] = null; });
    }
    /* Commas and a dollar sign are stripped rather than being read as
       NaN. A number box will not usually let one be typed, but one can
       arrive by pasting, and NaN becomes null in JSON, which would set
       no target while looking like it had. */
    var raw = String(box.value).replace(/[, $%]/g, '').trim();
    /* a percentage is typed as 55 and stored as 0.55, which is what the
       rest of the page divides and formats */
    rows[k][box.dataset.f] = raw === '' ? null
      : (box.dataset.pc ? Number(raw) / 100 : Number(raw));
  });

  /* A number box the browser cannot make sense of reads as empty, so
     "tbd" in a target field would save nothing and say it saved. The
     browser knows the difference and will say so if asked. */
  var wrong = [];
  document.querySelectorAll('[data-t]').forEach(function(box){
    var bad = (box.validity && box.validity.badInput) ||
              (box.value !== '' && !isFinite(Number(String(box.value).replace(/[, $]/g, ''))));
    if(!bad) return;
    var m = METRICS.find(function(x){ return x.key === box.dataset.t; });
    var name = (m && m.label) || box.dataset.t;
    if(wrong.indexOf(name) === -1) wrong.push(name);
  });
  if(wrong.length){
    message('bad', 'Nothing was saved. This is not a number: ' +
      wrong.join(', ') + '. Clear it and save again.');
    return;
  }
  var list = Object.keys(rows).map(function(k){ return rows[k]; })
    .filter(function(r){
      return r.weekly != null || r.monthly != null ||
             r.floor_value != null || r.ceiling_value != null;
    });
  if(!list.length){ $('tmsg').textContent = 'Nothing to save.'; return; }

  busy = true; btn.disabled = true; btn.textContent = 'Saving…';
  var h = GIDCAuth.headers(true);
  h.Prefer = 'resolution=merge-duplicates,return=representation';
  GIDCAuth.api('/rest/v1/kpi_targets', {method:'POST', headers:h, body:JSON.stringify(list)})
    .then(function(r){
      if(!r.ok) return r.json().catch(function(){ return {}; }).then(function(j){
        throw new Error(j.message || ('The database would not take it (' + r.status + ')')); });
      return r.json();
    })
    .then(function(saved){
      busy = false; btn.disabled = false; btn.textContent = 'Save targets';
      message('good', saved.length + ' target' + (saved.length === 1 ? '' : 's') +
        ' saved from ' + ((MONTHS.find(function(p){ return p.start === tat; }) || {}).name ||
        'that period') + '.');
      return loadTargetsFor(tat).then(load);
    })
    .catch(function(err){
      busy = false; btn.disabled = false; btn.textContent = 'Save targets';
      /* Say plainly that none of it went in. "The database would not
         take it" on its own reads like a warning about one row, and
         somebody can close the panel thinking the rest saved. */
      var why = String(err.message || '').trim();
      if(why && !/[.!?]$/.test(why)) why += '.';
      message('bad', 'Nothing was saved. ' + why +
        ' What you typed is still on screen, so nothing is lost ' +
        'as long as you do not reload this page.');
    });
}

function saveEntry(btn){
  if(busy) return;
  if(!mayEdit()){ $('emsg').textContent = 'Numbers are entered by an administrator.'; return; }
  var day = $('eday').value;
  if(!day){ $('emsg').textContent = 'Pick a day first.'; return; }
  var list = [];
  document.querySelectorAll('[data-e]').forEach(function(box){
    if(box.value === '') return;
    list.push({metric: box.dataset.e, on_date: day, value: Number(box.value),
               source: 'typed', entered_by: (ME && ME.name) || null});
  });
  if(!list.length){ $('emsg').textContent = 'Nothing typed in.'; return; }

  busy = true; btn.disabled = true; btn.textContent = 'Saving…';
  var h = GIDCAuth.headers(true);
  h.Prefer = 'resolution=merge-duplicates,return=representation';
  GIDCAuth.api('/rest/v1/kpi_daily', {method:'POST', headers:h, body:JSON.stringify(list)})
    .then(function(r){
      if(!r.ok) return r.json().catch(function(){ return {}; }).then(function(j){
        throw new Error(j.message || ('The database would not take it (' + r.status + ')')); });
      return r.json();
    })
    .then(function(saved){
      busy = false; btn.disabled = false; btn.textContent = 'Save the day';
      message('good', saved.length + ' number' + (saved.length === 1 ? '' : 's') +
        ' saved against ' + day + '.');
      return load();
    })
    .catch(function(err){
      busy = false; btn.disabled = false; btn.textContent = 'Save the day';
      message('bad', err.message);
    });
}

/* ---- what the page responds to -------------------------------------- */
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.dataset && t.dataset.span !== undefined){ span = Number(t.value); draw(); return; }
  if(t.dataset && t.dataset.at   !== undefined){ at = t.value; message(null); draw(); return; }
  if(t.dataset && t.dataset.tat  !== undefined){
    tat = t.value; message(null);
    loadTargetsFor(tat).then(function(){ drawTargets(); });
    return;
  }
  if(t.id === 'eday'){ loadDay(t.value); return; }
});

document.addEventListener('click', function(e){
  var t = e.target;
  var md = t.closest && t.closest('[data-mode]');
  if(md){
    var was = grainOf();
    mode = md.dataset.mode;
    span = modeRow()[4];
    if(panel === 'targets' && grainOf() !== 'month') panel = null;
    message(null);
    if(was === grainOf()){
      /* This week and last week are the same length one bucket apart, so
         there is nothing to fetch. But the bucket has to be chosen here:
         load() is what normally picks it, and drawing without it leaves
         the page with no period selected at all. */
      if(PERIODS.length)
        at = PERIODS[Math.min(mode === 'lastweek' ? 1 : 0, PERIODS.length - 1)].start;
      draw();
    } else {
      /* a different length means different buckets, so the one on screen
         belongs to the old one and load() picks a fresh one */
      at = null;
      load();
    }
    return;
  }
  /* Nothing below this line is reachable by a reader, because none of
     these controls is drawn for one. Checked anyway: a page is only ever
     a suggestion, since anyone who can open it can edit it, and these
     three lines are what keeps a reader's dashboard honest without
     relying on the database to turn them away with an error. */
  var p = t.closest && t.closest('[data-panel]');
  if(p){
    if(!mayEdit()) return;
    panel = panel === p.dataset.panel ? null : p.dataset.panel; message(null); draw(); return;
  }
  var st = t.closest && t.closest('[data-savetargets]');
  if(st){ saveTargets(st); return; }
  var se = t.closest && t.closest('[data-saveentry]');
  if(se){ saveEntry(se); return; }
});

/* the hover layer: a bar chart in a browser is interactive, so it has a
   tooltip rather than a legend of numbers nobody reads */
document.addEventListener('mouseover', function(e){
  var r = e.target;
  if(!r.dataset || r.dataset.tip === undefined) return;
  var tip = $('tip'), box = r.getBoundingClientRect();
  tip.innerHTML = esc(r.dataset.tip).replace(':', ': <i>') + '</i>';
  tip.style.left = (box.left + box.width / 2 + window.scrollX) + 'px';
  tip.style.top  = (box.top - 6 + window.scrollY) + 'px';
  tip.classList.add('on');
});
document.addEventListener('mouseout', function(e){
  if(e.target.dataset && e.target.dataset.tip !== undefined) $('tip').classList.remove('on');
});

/* ---- start ---------------------------------------------------------- */
GIDCAuth.load();
GIDCAuth.whoami().then(function(me){
  ME = me;
  if(!me) return;            /* the guard is already holding the page */
  load();
});
})();
</script>
