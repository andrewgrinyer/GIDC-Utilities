<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grinyer · Door Inventory</title>

<!-- gidc-guard
     who: team. Everybody who works here can see what is on the shelf,
     installers included. Adding, changing and removing a door is for
     Grinyer staff, and the database says the same thing underneath this
     page (can_see_inventory and can_change_inventory in
     sql/door-inventory.sql). Dealers never see any of it.

     Andrew, 12 November: when a dealer order comes in, the order email
     says if a door on it might already be here. That check is in the
     send-order edge function and reads this same list. A match is the
     same style (case, spaces and punctuation ignored), the same hollow or
     solid, and exactly the same width and height.

     Nothing is listed twice. Andrew asked that styles and the like come
     from what the database already holds, so the style is picked from
     the price list (wholesale_prices) and put through the alias table
     (wholesale_style_alias), and the core is one of the price list's own
     core columns for that style. This table holds only what is on the
     shelf. -->
<script>window.GIDC_TOOL = {who: 'team'};</script>
<script src="/gate.js"></script>
<script src="/guard.js"></script>

<style>
:root{
  --paper:#F6F6F7; --card:#FFFFFF; --ink:#17171A; --muted:#6E6E76;
  --rule:#E2E2E6; --rule-soft:#EFEFF2;
  --brass:#C80000; --brass-soft:#FCECEC;
  --ok:#2F6B3A; --ok-soft:#ECF5EE;
  --info:#2B5599; --info-soft:#EAF0FA;
  --pad:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:0 var(--pad) 60px;-webkit-text-size-adjust:100%}
.wrap{max-width:1040px;margin:0 auto}
h1{font-size:23px;margin:22px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px;max-width:66ch}

.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.card h2{font-size:15px;margin:0 0 10px}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr .8fr;gap:10px 12px;align-items:end}
.form .wide{grid-column:1 / -2}
.form label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;font-weight:600;margin-bottom:3px}
.form input,.form select{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:9px;
  font:inherit;min-height:40px;background:var(--card);color:var(--ink)}
.form input:focus,.form select:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:var(--brass)}
.form .acts{display:flex;gap:8px}
@media (max-width:720px){
  .form{grid-template-columns:1fr 1fr}
  .form .style,.form .wide,.form .acts{grid-column:1 / -1}
}

.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.search{flex:1;min-width:190px}
.search input{width:100%;padding:9px 12px;border:1px solid var(--rule);border-radius:9px;
  font:inherit;min-height:38px;background:var(--card);color:var(--ink)}
.search input:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:var(--brass)}
.chipbtn{border:1px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:999px;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer;min-height:38px}
.chipbtn.on{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:600}

.list{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-bottom:1px solid var(--rule-soft);padding:12px 16px}
.row:last-child{border-bottom:0}
.row.none{opacity:.55}
.row .what{flex:1 1 240px;min-width:0}
.row .st{font-weight:600;font-size:16px}
.row .meta{color:var(--muted);font-size:13.5px;margin-top:2px}
.row .note{font-size:13.5px;margin-top:3px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;margin-left:6px;
  vertical-align:2px}
.chip.Hollow{background:var(--info-soft);color:var(--info)}
.chip.Solid{background:var(--ok-soft);color:var(--ok)}
.chip.other{background:var(--rule-soft);color:var(--ink)}
.chip.warn{background:#FBF1E7;color:#9A4A12}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty b{min-width:30px;text-align:center;font-size:18px}
.qty button{width:38px;height:38px;border-radius:9px;border:1px solid var(--rule);background:var(--card);
  font:600 18px/1 inherit;cursor:pointer;color:var(--ink)}
.qty button:disabled{opacity:.4;cursor:default}
.rowacts{display:flex;gap:6px;flex:none}
@media (max-width:620px){
  .row{flex-wrap:wrap}
  .row .what{flex-basis:100%}
  .rowacts{margin-left:auto}
}

button.save{border:0;border-radius:9px;background:var(--brass);color:#fff;
  font:600 14px/1 inherit;padding:11px 18px;min-height:40px;cursor:pointer;white-space:nowrap}
button.save:disabled{opacity:.55;cursor:default}
button.plain{border:1px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:9px;font:600 14px/1 inherit;padding:10px 14px;min-height:40px;cursor:pointer;white-space:nowrap}
button.danger{border:1px solid var(--brass);background:var(--card);color:var(--brass);
  border-radius:9px;font:600 14px/1 inherit;padding:10px 14px;min-height:40px;cursor:pointer;white-space:nowrap}
.areyousure{flex-basis:100%;margin-top:0;padding:12px 14px;border-radius:10px;
  background:var(--brass-soft);color:var(--brass);font-size:14px}
.areyousure .acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}

.msg{padding:11px 13px;border-radius:9px;font-size:14px;margin:0 0 14px}
.msg.bad{background:var(--brass-soft);color:var(--brass)}
.msg.good{background:var(--ok-soft);color:var(--ok)}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:14.5px}
.count{color:var(--muted);font-size:13px;margin:12px 2px 0}
.gidc-build{position:fixed;right:10px;bottom:8px;z-index:60;font-size:11px;line-height:1;
  color:#8E8E99;opacity:.7;pointer-events:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Door Inventory</h1>
  <p class="sub" id="lede">Doors on the shelf. When a dealer order comes in with a door that
    has the same style, size and core as one here, the order email to Grinyer says it may be
    in inventory. Dealers never see this list.</p>

  <div id="msg" class="hide"></div>

  <div class="card hide" id="addcard">
    <h2 id="formtitle">Add a door</h2>
    <div class="form">
      <div class="style"><label for="f-style">Style</label>
        <select id="f-style"><option value="">Loading the price list&hellip;</option></select></div>
      <div><label for="f-w">Width (in)</label><input id="f-w" inputmode="decimal" placeholder="30"></div>
      <div><label for="f-h">Height (in)</label><input id="f-h" inputmode="decimal" placeholder="80, or blank"></div>
      <div><label for="f-core">Core</label>
        <select id="f-core"></select></div>
      <div><label for="f-qty">How many</label><input id="f-qty" inputmode="numeric" value="1"></div>
      <div class="wide"><label for="f-notes">Notes</label>
        <input id="f-notes" placeholder="Where it is, condition, handing"></div>
      <div class="acts">
        <button class="save" id="f-save">Add</button>
        <button class="plain hide" id="f-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div class="bar" id="filters">
    <span class="search"><input id="q" type="search" autocomplete="off"
      placeholder="Search: style, size like 30x80, core, notes" aria-label="Search the inventory"></span>
    <button class="chipbtn hide" id="checkonly"></button>
    <button class="chipbtn" id="showzero">Show none left</button>
  </div>
  <div class="list" id="list"><div class="empty">Loading&hellip;</div></div>
  <p class="count" id="count"></p>
</div>
<div class="gidc-build">Inventory 1.3 &middot; 12 Nov 2026</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
}
/* The same normalising the portal and the order email use, so what this
   page calls the same style is what the alert calls the same style. */
function pnorm(s){ return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, ''); }

/* "30", "29.5", "29 1/2", "29-1/2" and 29 1/2" all read as inches. */
function inches(v){
  var t = String(v == null ? '' : v).trim().replace(/["”]|in$/gi, '').trim();
  var m = t.match(/^(\d+(?:\.\d+)?)$/);
  if(m) return Number(m[1]);
  m = t.match(/^(\d+)[\s-]+(\d+)\/(\d+)$/);
  if(m && Number(m[3])) return Number(m[1]) + Number(m[2]) / Number(m[3]);
  return null;
}
/* 29.5 shows as 29 1/2, the way it is said in the shop. */
function showIn(n){
  n = Number(n);
  if(!isFinite(n)) return '';
  var whole = Math.floor(n + 1e-9), frac = n - whole;
  if(frac < 0.001) return String(whole);
  var sixteenths = Math.round(frac * 16);
  if(Math.abs(sixteenths / 16 - frac) > 0.001) return String(Number(n.toFixed(3)));
  var num = sixteenths, den = 16;
  while(num % 2 === 0){ num /= 2; den /= 2; }
  return whole + ' ' + num + '/' + den;
}

var ME = null, ROWS = [], query = '', showZero = false, checkOnly = false;
/* A line somebody needs to look at: the count sheet was unclear (its
   notes start "Check:"), or the price list does not know the style. */
function needsCheck(d){
  return /^\s*check:/i.test(d.notes || '') || (REF.ok && !REF.name[styleKey(d.style)]);
}

/* ---- the price list, which is where styles and cores come from --------
   Read the same way the portal reads it: a style is sold in a core when
   that cell has a price above nothing. ALIAS turns the portal's name for
   a door into the list's, so either name finds it. */
var CORE_ORDER = ['Hollow', 'Solid', 'Bifold', '1.75'];
var REF = {ok: false, name: {}, cores: {}, alias: {}};
function styleKey(s){ var k = pnorm(s); return REF.alias[k] || k; }
function loadReference(){
  return Promise.all([
    GIDCAuth.api('/rest/v1/wholesale_prices?select=style,size_key,price&limit=5000', {headers: GIDCAuth.headers()}),
    GIDCAuth.api('/rest/v1/wholesale_style_alias?select=order_style,price_style', {headers: GIDCAuth.headers()})
  ]).then(function(rs){
    return Promise.all([rs[0].ok ? rs[0].json() : [], rs[1].ok ? rs[1].json() : []]);
  }).then(function(got){
    (got[1] || []).forEach(function(a){
      if(a && a.order_style && a.price_style) REF.alias[pnorm(a.order_style)] = pnorm(a.price_style);
    });
    (got[0] || []).forEach(function(p){
      if(!(Number(p.price) > 0)) return;
      var k = pnorm(p.style), core = String(p.size_key || '').split('|').pop();
      if(!REF.name[k]) REF.name[k] = String(p.style).trim();
      (REF.cores[k] = REF.cores[k] || {})[core] = true;
    });
    REF.ok = Object.keys(REF.name).length > 0;
  }).catch(function(){ /* without it the form still works, with all four cores */ });
}
/* THE STYLE IS A PROPER DROP DOWN
   Andrew, 12 November: clicking Style showed nothing. It was a typing box
   with suggestions, and most browsers only offer those once something is
   typed. Now it is a list of every style the price list sells, so a click
   shows them all. A line already on the shelf under a name the price list
   does not have keeps that name, marked, so it can still be edited. */
function fillStyles(keep){
  var sel = $('f-style'), was = keep === undefined ? sel.value : (keep || '');
  var names = Object.keys(REF.name).map(function(k){ return REF.name[k]; })
    .sort(function(a, b){ return a.toLowerCase().localeCompare(b.toLowerCase()); });
  var h = '<option value="">' + (REF.ok ? 'Pick a style' : 'The price list could not be read') + '</option>';
  if(was && !(REF.ok && REF.name[styleKey(was)]))
    h += '<option value="' + esc(was) + '">' + esc(was) + ' (not on the price list)</option>';
  h += names.map(function(n){ return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
  sel.innerHTML = h;
  sel.value = was && REF.ok && REF.name[styleKey(was)] ? REF.name[styleKey(was)] : was;
}
function coresFor(style){
  var have = REF.ok && REF.cores[styleKey(style)];
  var list = CORE_ORDER.filter(function(c){ return !have || have[c]; });
  return list.length ? list : CORE_ORDER;
}
/* "Not recorded" is for a door whose core nobody wrote down. It matches
   an order line of any core, the same as a blank height. */
function fillCores(keep){
  var sel = $('f-core'), was = keep === undefined ? sel.value : (keep || '');
  var list = coresFor($('f-style').value);
  sel.innerHTML = list.map(function(c){ return '<option>' + esc(c) + '</option>'; }).join('') +
    '<option value="">Not recorded</option>';
  if(was === '' || list.indexOf(was) !== -1) sel.value = was;
}
function sizeOf(d){
  return d.height_in == null ? showIn(d.width_in) + ' wide, height not recorded'
                             : showIn(d.width_in) + ' x ' + showIn(d.height_in);
}
function sameNum(a, b){ return a == null || b == null ? a == b : Math.abs(a - b) < 0.01; }
var editId = null, confirmDel = null, busy = false;

/* Adding and changing is Grinyer staff, the same list as
   can_change_inventory() in the database. An installer reads only. */
function canChange(){ return !!ME && GIDCAuth.isStaff(ME); }

function message(kind, text){
  var m = $('msg');
  if(!kind){ m.className = 'hide'; m.textContent = ''; return; }
  m.className = 'msg ' + kind; m.textContent = text;
}
function failText(r, what){
  return r.json().catch(function(){ return {}; }).then(function(j){
    if(r.status === 404 || /door_inventory/.test(j.message || '') && /exist|find/i.test(j.message || ''))
      throw new Error('The inventory is not set up in the database yet. ' +
        'Run door-inventory.sql in Supabase first.');
    throw new Error(j.message || (what + ' (' + r.status + ')'));
  });
}

/* ---- reading ---------------------------------------------------------- */
function load(){
  return GIDCAuth.api('/rest/v1/door_inventory?select=*&order=style.asc,width_in.asc,height_in.asc',
      {headers: GIDCAuth.headers()})
    .then(function(r){ if(!r.ok) return failText(r, 'Could not read the inventory'); return r.json(); })
    .then(function(rows){ ROWS = rows || []; draw(); })
    .catch(function(err){
      $('list').innerHTML = '<div class="empty">' + esc(err.message) + '</div>';
    });
}

/* ---- search ------------------------------------------------------------
   Andrew, 12 November: a search on the inventory. One box, any order:

     30x80, 30 x 80, 29 1/2 x 80   that exact width and height
     30, 29.5, 29 1/2              that width or that height
     hollow, solid, bifold, 1.75   that core
     anything else                 style or notes, every word must be there

   A style is found under either name: "samish" finds Columbia through the
   alias table, the same way the order email matches. A door whose height
   or core was not recorded is found by any height or core, which is also
   how the email treats it. So "Columbia 30x80 hollow" lists exactly what
   an order line for that door would be told about. */
var NUM = '\\d+(?:\\.\\d+)?(?:[\\s-]+\\d+\\/\\d+)?';
var CORE_WORDS = {hollow: 'Hollow', solid: 'Solid', bifold: 'Bifold', '1.75': '1.75', thick: '1.75'};
function parseSearch(text){
  var t = ' ' + String(text || '').toLowerCase().replace(/\u00d7/g, 'x').replace(/["\u201d]/g, ' ') + ' ';
  var f = {w: null, h: null, nums: [], cores: [], words: [], text: ''};
  var m = t.match(new RegExp('(' + NUM + ')\\s*(?:x|by)\\s*(' + NUM + ')'));
  if(m){ f.w = inches(m[1]); f.h = inches(m[2]); t = t.replace(m[0], ' '); }
  t = t.replace(new RegExp('(^|\\s)1\\.75(?=\\s)', 'g'), ' thick ');
  t = t.replace(new RegExp('(^|\\s)(' + NUM + ')(?=\\s)', 'g'), function(all, sp, n){
    var v = inches(n); if(v !== null) f.nums.push(v); return ' '; });
  t.split(/\s+/).forEach(function(w){
    if(!w) return;
    if(CORE_WORDS[w]) f.cores.push(CORE_WORDS[w]); else f.words.push(w);
  });
  f.text = f.words.join(' ');
  return f;
}
function searchHit(d, f){
  var w = Number(d.width_in), h = d.height_in == null ? null : Number(d.height_in);
  if(f.w !== null && !sameNum(w, f.w)) return false;
  if(f.h !== null && h !== null && !sameNum(h, f.h)) return false;
  for(var i = 0; i < f.nums.length; i++)
    if(!sameNum(w, f.nums[i]) && (h === null || !sameNum(h, f.nums[i]))) return false;
  if(f.cores.length && d.core && f.cores.indexOf(d.core) === -1) return false;
  if(!f.words.length) return true;
  /* the whole name of a style, through the alias table */
  var whole = pnorm(f.text);
  if(REF.alias[whole] && REF.alias[whole] === styleKey(d.style)) return true;
  /* A word matches the start of a word in the style or the notes, so
     "b" finds Rack B without finding every Columbia. A longer word may
     sit anywhere in the style, so "lite" finds Clear 1-Lite. */
  var styles = [d.style, REF.name[styleKey(d.style)] || ''];
  var tokens = (styles.join(' ') + ' ' + (d.notes || '')).toLowerCase().split(/[^a-z0-9.\/]+/);
  var joined = styles.map(pnorm).join(' ');
  return f.words.every(function(word){
    var wn = pnorm(word);
    if(!wn) return true;
    return tokens.some(function(tk){ return tk.indexOf(wn) === 0 || tk.indexOf(word) === 0; }) ||
           (wn.length >= 3 && joined.indexOf(wn) !== -1);
  });
}
function showing(){
  var q = query.trim(), f = q ? parseSearch(q) : null;
  return ROWS.filter(function(d){
    if(checkOnly) return needsCheck(d) && (!f || searchHit(d, f));
    /* A search looks at every line, including ones with none left, so
       "do we have one" is answered in full. */
    if(!f && !showZero && !(d.qty > 0)) return false;
    return !f || searchHit(d, f);
  });
}

function draw(){
  $('showzero').className = 'chipbtn' + (showZero ? ' on' : '');
  var toCheck = ROWS.filter(needsCheck).length;
  if(!toCheck) checkOnly = false;
  $('checkonly').className = 'chipbtn' + (toCheck ? '' : ' hide') + (checkOnly ? ' on' : '');
  $('checkonly').textContent = 'Needs a check (' + toCheck + ')';

  var rows = showing();
  if(!rows.length){
    $('list').innerHTML = '<div class="empty">' +
      (ROWS.length ? 'Nothing matches that.' : 'No doors in inventory yet.') + '</div>';
  } else {
    var can = canChange();
    $('list').innerHTML = rows.map(function(d){
      var none = !(d.qty > 0);
      return '<div class="row' + (none ? ' none' : '') + '">' +
        '<div class="what">' +
          '<div class="st">' + esc(d.style) +
            '<span class="chip ' + (d.core === 'Hollow' || d.core === 'Solid' ? d.core : 'other') + '">' +
              esc(d.core || 'Core not recorded') + '</span>' +
            /* A style the price list does not know never matches an order
               until somebody picks the right name with Edit. */
            (REF.ok && !REF.name[styleKey(d.style)] ? '<span class="chip warn">Not on the price list</span>' : '') +
          '</div>' +
          '<div class="meta">' + esc(sizeOf(d)) +
            (d.updated_by ? ' · last changed by ' + esc(d.updated_by) : '') + '</div>' +
          (d.notes ? '<div class="note">' + esc(d.notes) + '</div>' : '') +
        '</div>' +
        '<div class="qty">' +
          (can ? '<button data-dec="' + esc(d.id) + '" aria-label="One fewer"' + (none ? ' disabled' : '') + '>&minus;</button>' : '') +
          '<b>' + esc(d.qty) + '</b>' +
          (can ? '<button data-inc="' + esc(d.id) + '" aria-label="One more">+</button>' : '') +
        '</div>' +
        (can && confirmDel !== d.id
          ? '<div class="rowacts"><button class="plain" data-edit="' + esc(d.id) + '">Edit</button>' +
            '<button class="danger" data-del="' + esc(d.id) + '">Remove</button></div>' : '') +
        (can && confirmDel === d.id
          ? '<div class="areyousure">Remove <b>' + esc(d.style) + ' ' + esc(sizeOf(d)) + '</b> from the list for good? To record that the last one went, ' +
              'take the count to nothing instead.' +
            '<div class="acts"><button class="danger" data-delyes="' + esc(d.id) + '">Yes, remove it</button>' +
            '<button class="plain" data-delno="1">Keep it</button></div></div>' : '') +
      '</div>';
    }).join('');
  }
  var onShelf = ROWS.reduce(function(t, d){ return t + (d.qty > 0 ? d.qty : 0); }, 0);
  var found = query.trim() ? showing() : null;
  $('count').textContent = found
    ? (found.length === 1 ? '1 line matches' : found.length + ' lines match') + ', ' +
      found.reduce(function(t, d){ return t + (d.qty > 0 ? d.qty : 0); }, 0) + ' on the shelf'
    : ROWS.length
    ? onShelf + (onShelf === 1 ? ' door' : ' doors') + ' on the shelf across ' +
      (function(n){ return n + (n === 1 ? ' line' : ' lines'); })(ROWS.filter(function(d){ return d.qty > 0; }).length)
    : '';
}

/* ---- the form ---------------------------------------------------------- */
function clearForm(){
  editId = null;
  fillStyles(''); $('f-w').value = ''; $('f-h').value = '';
  fillCores('Hollow'); $('f-qty').value = '1'; $('f-notes').value = '';
  $('formtitle').textContent = 'Add a door';
  $('f-save').textContent = 'Add';
  $('f-cancel').className = 'plain hide';
}
function startEdit(id){
  var d = ROWS.find(function(x){ return x.id === id; });
  if(!d) return;
  editId = id;
  fillStyles(d.style); $('f-w').value = showIn(d.width_in); $('f-h').value = d.height_in == null ? '' : showIn(d.height_in);
  fillCores(d.core); $('f-qty').value = d.qty; $('f-notes').value = d.notes || '';
  $('formtitle').textContent = 'Change this door';
  $('f-save').textContent = 'Save';
  $('f-cancel').className = 'plain';
  $('addcard').scrollIntoView({behavior: 'smooth', block: 'start'});
  $('f-style').focus();
}
function readForm(){
  var style = $('f-style').value.trim();
  var w = inches($('f-w').value), hRaw = $('f-h').value.trim(), h = hRaw ? inches(hRaw) : null;
  var q = $('f-qty').value.trim();
  if(!style) throw new Error('Pick a style from the list.');
  var editing = editId && ROWS.find(function(x){ return x.id === editId; });
  /* Saved under the price list's own spelling, so the list and the
     inventory never disagree about what a door is called. */
  if(REF.ok){
    var known = REF.name[styleKey(style)];
    /* A line from the count sheet under a name the list does not have may
       still have its count or notes changed; it stays marked until a
       style from the list is picked. */
    if(!known && !(editing && editing.style === style))
      throw new Error(style + ' is not on the price list. Pick the style from the list.');
    if(known) style = known;
  }
  var core = $('f-core').value || null;
  if(core && coresFor(style).indexOf(core) === -1)
    throw new Error('The price list does not sell ' + style + ' in ' + core + '.');
  if(w === null || w <= 0 || w >= 200) throw new Error('The width should be inches, like 30 or 29 1/2.');
  if(hRaw && (h === null || h <= 0 || h >= 200)) throw new Error('The height should be inches, like 80, or blank if it is not known.');
  if(!/^\d+$/.test(q)) throw new Error('How many should be a whole number.');
  return {style: style, width_in: w, height_in: h, core: core,
          qty: Number(q), notes: $('f-notes').value.trim() || null};
}
/* Asking for the row back tells "saved" apart from "the database refused
   and said nothing", which PostgREST does by returning an empty list. */
function send(method, path, body){
  var h = GIDCAuth.headers(true); h.Prefer = 'return=representation';
  return GIDCAuth.api(path, {method: method, headers: h, body: body ? JSON.stringify(body) : undefined})
    .then(function(r){
      if(!r.ok) return failText(r, 'The database would not take it');
      return r.json().catch(function(){ return []; });
    })
    .then(function(rows){
      if(!rows.length) throw new Error('The database would not allow that. Only Grinyer staff can change the inventory.');
      return rows[0];
    });
}
function put(row){
  var i = ROWS.findIndex(function(x){ return x.id === row.id; });
  if(i >= 0) ROWS[i] = row; else ROWS.push(row);
  ROWS.sort(function(a, b){
    return a.style.localeCompare(b.style) || a.width_in - b.width_in || (a.height_in || 0) - (b.height_in || 0); });
}
function save(){
  if(busy) return;
  var body;
  try { body = readForm(); } catch(err){ message('bad', err.message); return; }
  /* The same door twice is one line with a bigger count, so the email
     never lists one door as two. */
  if(!editId){
    var same = ROWS.find(function(d){
      return styleKey(d.style) === styleKey(body.style) && d.core === body.core &&
             sameNum(Number(d.width_in), body.width_in) &&
             sameNum(d.height_in == null ? null : Number(d.height_in), body.height_in);
    });
    if(same){
      message('bad', 'That door is already on the list. Use + on its line, or Edit it.');
      return;
    }
  }
  busy = true; $('f-save').disabled = true; message(null);
  var p = editId
    ? send('PATCH', '/rest/v1/door_inventory?id=eq.' + encodeURIComponent(editId), body)
    : send('POST', '/rest/v1/door_inventory', body);
  p.then(function(row){
      put(row); var was = editId; clearForm(); draw();
      message('good', (was ? 'Saved ' : 'Added ') + row.style + ' ' + sizeOf(row) + '.');
    })
    .catch(function(err){ message('bad', err.message); })
    .then(function(){ busy = false; $('f-save').disabled = false; });
}
function bump(id, by){
  if(busy) return;
  var d = ROWS.find(function(x){ return x.id === id; });
  if(!d) return;
  var to = Math.max(0, d.qty + by);
  if(to === d.qty) return;
  busy = true; message(null);
  send('PATCH', '/rest/v1/door_inventory?id=eq.' + encodeURIComponent(id), {qty: to})
    .then(function(row){ put(row); draw(); })
    .catch(function(err){ message('bad', err.message); })
    .then(function(){ busy = false; });
}
function remove(id){
  if(busy) return;
  busy = true; message(null);
  send('DELETE', '/rest/v1/door_inventory?id=eq.' + encodeURIComponent(id))
    .then(function(row){
      ROWS = ROWS.filter(function(x){ return x.id !== id; });
      if(editId === id) clearForm();
      confirmDel = null; draw();
      message('good', 'Removed ' + row.style + ' ' + sizeOf(row) + '.');
    })
    .catch(function(err){ confirmDel = null; draw(); message('bad', err.message); })
    .then(function(){ busy = false; });
}

/* ---- what the page responds to ---------------------------------------- */
document.addEventListener('click', function(e){
  var t = e.target, el;
  if(!t.closest) return;
  if(t.closest('#f-save')){ save(); return; }
  if(t.closest('#f-cancel')){ clearForm(); message(null); return; }
  if(t.closest('#showzero')){ showZero = !showZero; draw(); return; }
  if(t.closest('#checkonly')){ checkOnly = !checkOnly; draw(); return; }
  if((el = t.closest('[data-inc]'))){ bump(el.dataset.inc, 1); return; }
  if((el = t.closest('[data-dec]'))){ bump(el.dataset.dec, -1); return; }
  if((el = t.closest('[data-edit]'))){ message(null); startEdit(el.dataset.edit); return; }
  if((el = t.closest('[data-del]'))){ confirmDel = el.dataset.del; message(null); draw(); return; }
  if(t.closest('[data-delno]')){ confirmDel = null; draw(); return; }
  if((el = t.closest('[data-delyes]'))){ remove(el.dataset.delyes); return; }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && e.target && e.target.closest && e.target.closest('.form')) save();
});
$('q').addEventListener('input', function(e){ query = e.target.value; draw(); });
$('f-style').addEventListener('change', function(){ fillCores(); });

/* ---- start ------------------------------------------------------------ */
GIDCAuth.load();
GIDCAuth.whoami().then(function(me){
  ME = me;
  if(!me) return;              /* the guard is already holding the page */
  fillCores('Hollow');
  if(canChange()) $('addcard').className = 'card';
  else $('lede').textContent = 'Doors on the shelf, with how many of each. The office keeps this list.';
  /* An installer cannot read the price list, and does not need to: the
     list is only for adding and changing. */
  (canChange() ? loadReference() : Promise.resolve()).then(function(){
    fillStyles('');
    if(canChange() && !REF.ok)
      message('bad', 'The price list could not be read, so there are no styles to pick from. ' +
        'Reload the page; if it stays like this, tell Andrew.');
    return load();
  });
});
})();
</script>
