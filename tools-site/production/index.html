<style>
:root{
  color-scheme: light;
  --paper:#F4F3F1; --card:#FFFFFF; --ink:#17171A; --muted:#6E6E76;
  --rule:#E2E2E6; --rule-soft:#EFEFF2;
  --brand:#C80000; --brand-soft:#FCECEC; --brand-dark:#9E0000;
  --good:#0ca30c; --good-soft:#E8F6E8;
  --bad:#d03b3b;  --bad-soft:#FBEAEA;
  --pad:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--pad) 80px}

.hero{background:var(--brand);color:#fff;margin:0 0 22px;
  background-image:linear-gradient(100deg,var(--brand-dark),var(--brand) 62%)}
.hero .in{max-width:560px;margin:0 auto;padding:20px var(--pad) 24px}
.hero .logo{height:34px;width:auto;display:block;margin:0 0 14px}
.hero h1{font-size:25px;margin:0;letter-spacing:-.015em;font-weight:700}
.hero .sub{opacity:.85;font-size:14.5px;margin:5px 0 0}

.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;
  padding:4px 18px 18px;margin:0 0 16px}

label.fld{display:block;font-size:13px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;margin:18px 0 6px}

input[type=date]{width:100%;padding:13px 14px;border:1px solid var(--rule);
  border-radius:10px;font:inherit;background:var(--card);color:var(--ink);min-height:50px}

/* One row per number. The boxes are big because this gets filled in on a
   phone, at the end of a shift, by somebody who has been on their feet
   all day and is not going to enjoy hunting for a small target. */
.num{display:flex;align-items:center;gap:14px;padding:13px 0;
  border-bottom:1px solid var(--rule-soft)}
.num:last-of-type{border-bottom:0}
.num .nm{flex:1}
.num .nm b{display:block;font-size:16.5px;font-weight:600}
.num .nm span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.num input{width:108px;padding:13px 12px;border:1px solid var(--rule);border-radius:10px;
  font:inherit;font-size:19px;font-weight:600;text-align:right;min-height:52px;
  font-variant-numeric:tabular-nums;background:var(--card);color:var(--ink)}
.num input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.num.saved input{border-color:var(--good);background:var(--good-soft)}

button.go{width:100%;margin-top:20px;padding:16px 18px;border:0;border-radius:11px;
  background:var(--brand);color:#fff;font:inherit;font-size:17px;font-weight:600;
  cursor:pointer;min-height:56px}
button.go:hover{background:var(--brand-dark)}
button.go:disabled{opacity:.55;cursor:default}

.msg{margin:16px 0 0;padding:13px 15px;border-radius:11px;font-size:15px}
.msg.good{background:var(--good-soft);color:var(--good)}
.msg.bad {background:var(--bad-soft); color:var(--bad)}
.hide{display:none}

.note{font-size:13.5px;color:var(--muted);margin:14px 0 0;line-height:1.55}
.gidc-build{position:fixed;right:10px;bottom:8px;z-index:60;font-size:11px;line-height:1;
  color:#8E8E99;opacity:.7;font-variant-numeric:tabular-nums;pointer-events:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>

<script>
'use strict';

var $ = function(id){ return document.getElementById(id); };
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
}

/* The four the production team own. Listed here rather than read from
   the metric table because this page writes them and the database only
   allows these four: a fifth appearing in the list would be a box that
   never saves, which is worse than no box. */
var NUMS = [
  ['doors_cut',     'Doors Cut',     'off the saw today'],
  ['doors_painted', 'Doors Painted', 'through the paint line'],
  ['doors_packed',  'Doors Packed',  'boxed and ready to go'],
  ['remakes',       'Remakes',       'had to be made again']
];

var ME = null;
var busy = false;

function today(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}

function message(kind, text){
  var m = $('msg');
  if(!kind){ m.className = 'hide'; m.textContent = ''; return; }
  m.className = 'msg ' + kind; m.textContent = text;
}

function drawNums(){
  var h = '';
  NUMS.forEach(function(n){
    h += '<div class="num" data-row="' + esc(n[0]) + '">' +
         '<div class="nm"><b>' + esc(n[1]) + '</b><span>' + esc(n[2]) + '</span></div>' +
         '<input type="number" inputmode="numeric" min="0" step="1" ' +
           'id="f_' + esc(n[0]) + '" data-e="' + esc(n[0]) + '" ' +
           'aria-label="' + esc(n[1]) + '" placeholder="0">' +
         '</div>';
  });
  $('nums').innerHTML = h;
}

/* What is already saved against that day, so a second visit corrects
   rather than guesses, and so nobody types the day in twice. */
/* Deliberately does not clear the message. A save ends by reading the
   day back, and clearing here wiped the confirmation the moment it
   appeared: the save looked like it had done nothing. Clearing belongs
   to the thing that changes the day, which is the picker. */
function loadDay(day){
  NUMS.forEach(function(n){
    var box = $('f_' + n[0]);
    if(box){ box.value = ''; box.closest('.num').classList.remove('saved'); }
  });
  $('note').textContent = 'Reading what is already saved for ' + day + '…';
  var keys = NUMS.map(function(n){ return n[0]; }).join(',');
  GIDCAuth.api('/rest/v1/kpi_daily?select=metric,value,entered_by&on_date=eq.' + day +
               '&metric=in.(' + keys + ')', {headers: GIDCAuth.headers()})
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows){
      var who = null;
      (rows || []).forEach(function(row){
        var box = $('f_' + row.metric);
        if(box){
          box.value = row.value;
          box.closest('.num').classList.add('saved');
        }
        if(row.entered_by) who = row.entered_by;
      });
      if(!rows || !rows.length){
        $('note').textContent = 'Nothing saved for that day yet.';
      } else {
        $('note').textContent = rows.length + ' number' + (rows.length === 1 ? '' : 's') +
          ' already saved for that day' + (who ? ', by ' + who : '') +
          '. Changing one and saving replaces it rather than adding a second.';
      }
    })
    .catch(function(){
      $('note').textContent = 'Could not read what is already saved. You can still type and save.';
    });
}

/* Who is typing. Asked for at start, but the session is not always
   loaded by then and whoami answers null when it is not, which left
   every row stamped with nobody. So it is asked again here if it has to
   be, and the save waits for the answer rather than guessing. */
function knowMe(){
  if(ME && ME.name) return Promise.resolve(ME);
  return GIDCAuth.whoami()
    .then(function(me){ if(me) ME = me; return ME; })
    .catch(function(){ return ME; });
}

function save(btn){
  if(busy) return;
  var day = $('day').value;
  if(!day){ message('bad', 'Pick a day first.'); return; }

  var list = [];
  NUMS.forEach(function(n){
    var box = $('f_' + n[0]);
    if(!box || box.value === '') return;
    var v = Number(box.value);
    if(!isFinite(v) || v < 0) return;
    list.push({metric: n[0], on_date: day, value: v,
               source: 'shop', entered_by: (ME && ME.name) || null});
  });
  if(!list.length){ message('bad', 'Nothing typed in yet.'); return; }

  busy = true; btn.disabled = true; btn.textContent = 'Saving…';
  knowMe().then(function(){
  list.forEach(function(row){ row.entered_by = (ME && ME.name) || null; });
  var h = GIDCAuth.headers(true);
  /* merge-duplicates so a correction replaces the day rather than adding
     a second row against it */
  h.Prefer = 'resolution=merge-duplicates,return=representation';
  return GIDCAuth.api('/rest/v1/kpi_daily', {method: 'POST', headers: h, body: JSON.stringify(list)})
    .then(function(r){
      if(r.ok) return r.json();
      return r.json().catch(function(){ return {}; }).then(function(j){
        /* the database refusing is the normal way somebody outside the
           shop finds out they cannot write these, so it says so plainly
           rather than showing a status code */
        if(r.status === 401 || r.status === 403 || /row-level security/i.test(j.message || ''))
          throw new Error('Your login is not allowed to save production numbers. ' +
                          'Ask Andrew to put you in the shop group.');
        throw new Error(j.message || ('The database would not take it (' + r.status + ')'));
      });
    })
    .then(function(saved){
      busy = false; btn.disabled = false; btn.textContent = 'Save the day';
      message('good', saved.length + ' number' + (saved.length === 1 ? '' : 's') +
              ' saved against ' + day + '.');
      loadDay(day);
    })
    .catch(function(err){
      busy = false; btn.disabled = false; btn.textContent = 'Save the day';
      message('bad', err.message);
    });
  });
}

document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'day'){
    message(null);          /* a different day, so an older message is stale */
    loadDay(e.target.value);
  }
});
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('[data-save]');
  if(b) save(b);
});

(function start(){
  drawNums();
  $('day').value = today();
  $('day').max = today();     /* no typing tomorrow's numbers in */
  /* whoami before the first read, so a save made straight away is still
     stamped with who made it. Without the wait, entered_by was null for
     anybody quick enough to type before the answer came back. */
  GIDCAuth.whoami()
    .then(function(me){ ME = me; })
    .catch(function(){ ME = null; })
    .then(function(){ loadDay($('day').value); });
})();
</script>
</body>
</html>
